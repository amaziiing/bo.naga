  <body class="report-body livechat-template-page standardized-listing-page bo-charcoal bo-account-chip">
    <div class="report-shell">
      <aside class="report-sidebar" id="reportSidebar">
          <div class="report-brand">
              <div>Backoffice</div><button class="close-side" data-close-sidebar><i
                      class="bi bi-x-lg"></i></button>
          </div>
          <nav class="report-nav"></nav>
      </aside>
      <div class="sidebar-overlay" id="reportOverlay" data-close-sidebar></div>
      <main class="report-main">
        <header class="report-topbar" data-bo-topbar data-bo-title="Template Messages" data-bo-icon="bi-chat-square-text" data-bo-hamb-aria="Open menu"></header>
<script src="assets/js/bo-topbar.js?v=1"></script>
        <section class="report-content">
          <div class="livechat-template-layout">
            <section class="template-list-card">
              <div class="template-pane-head">
                <div>
                  <h2>Templates <span class="livechat-inbox-total" id="templateListTotal"></span></h2>
                  <p>Numbered chips 1–9 appear in Live Chat.</p>
                </div>
                <button class="clean-btn" type="button" id="templateRefreshBtn" aria-label="Refresh templates"><i class="bi bi-arrow-clockwise"></i></button>
              </div>
              <div class="livechat-search">
                <i class="bi bi-search" aria-hidden="true"></i>
                <input id="templateSearch" placeholder="Search title or message" autocomplete="off">
              </div>
              <div class="template-list" id="templateList">
                <div class="livechat-empty">
                  <span class="livechat-empty-icon"><i class="bi bi-chat-square-text"></i></span>
                  <strong>Loading templates</strong>
                </div>
              </div>
            </section>
            <section class="template-form-card">
              <div class="template-pane-head">
                <div>
                  <h2 id="templateFormTitle">New template</h2>
                  <p>Click a template on the left to edit it.</p>
                </div>
                <a class="template-back" href="livechat.html"><i class="bi bi-chat-dots"></i> Live Chat</a>
              </div>
              <form id="templateForm" class="template-form">
                <input type="hidden" id="templateId">
                <div class="field">
                  <label for="templateTitle">Title</label>
                  <input id="templateTitle" placeholder="Example: Deposit Delay" required>
                </div>
                <div class="field template-message-field">
                  <label for="templateMessage">Message</label>
                  <textarea id="templateMessage" rows="6" placeholder="What the operator sends. Paragraphs are kept." required></textarea>
                </div>
                <div class="form-grid-2">
                  <div class="field">
                    <label for="templateSortOrder">Chip order</label>
                    <input id="templateSortOrder" type="number" min="0" value="0" title="Lower number appears first in Live Chat">
                  </div>
                  <div class="field">
                    <label for="templateStatus">Status</label>
                    <select id="templateStatus">
                      <option value="1">Active</option>
                      <option value="0">Inactive</option>
                    </select>
                  </div>
                </div>
                <div class="template-actions">
                  <button class="btn-primary-clean" type="submit" id="templateSaveBtn"><i class="bi bi-save"></i> Save</button>
                  <button class="clean-btn" type="button" id="templateResetBtn"><i class="bi bi-plus-lg"></i> New</button>
                </div>
                <div class="form-status" id="templateStatusText"></div>
              </form>
            </section>
          </div>
        </section>
      </main>
    </div>
