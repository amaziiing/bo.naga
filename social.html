<body class="report-body standardized-listing-page social-page bo-charcoal bo-account-chip">
<div class="report-shell">
<aside class="report-sidebar" id="reportSidebar">
<div class="report-brand">
<div>Backoffice</div><button class="close-side" data-close-sidebar=""><i class="bi bi-x-lg"></i></button>
</div>
<nav class="report-nav"></nav>
</aside>
<div class="sidebar-overlay" data-close-sidebar="" id="reportOverlay"></div>
<main class="report-main">
<header class="report-topbar" data-bo-topbar data-bo-title="Social" data-bo-icon="bi-share"></header>
<script src="assets/js/bo-topbar.js?v=1"></script>
<section class="report-content">
<div class="table-card social-list-card">
<div class="user-toolbar">
<div class="user-toolbar-actions">
<button class="clean-btn" id="socialRefresh" type="button"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
<button class="clean-btn primary" id="socialOpenCreate" type="button"><i class="bi bi-plus-lg"></i> Create Social Link</button>
</div>
</div>
<div class="social-card-wrap" id="socialCardWrap">
<div class="social-card-grid" id="socialBody" aria-live="polite">
<div class="social-card-state">Loading...</div>
</div>
</div>
<div class="table-footer social-table-footer"><div class="table-info" id="socialTableInfo">Social link records</div><div class="pagination-clean"><button class="page-btn" type="button" aria-label="Previous page">‹</button><span class="page-btn active">1</span><button class="page-btn" type="button" aria-label="Next page">›</button></div></div>
</div>
</section>
</main>
</div>
<!-- Modals stay at body level, outside .report-shell: main.report-main is a z-index:1 stacking
     context, so a modal nested inside it can never paint above the sidebar's z-index:1040. -->
<div aria-hidden="true" class="modal-clean pm-modal social-modal" id="socialModal">
<div aria-hidden="true" class="modal-clean-panel pm-modal-panel social-modal-panel">
<div aria-hidden="true" class="modal-clean-head pm-modal-head social-modal-head">
<div><h3 id="socialFormTitle">Create Social Link</h3><small>Upload an image and set the URL opened by the frontend.</small></div>
<button class="modal-clean-close" data-social-close="" type="button"><i class="bi bi-x-lg"></i></button>
</div>
<form class="modal-clean-body pm-modal-body social-modal-body" id="socialForm">
<input id="socialId" type="hidden"/>
<section class="pm-form-section">
<h4><i class="bi bi-link-45deg"></i> 1. Destination URL</h4>
<div class="field"><label>URL <b>*</b></label><input autocomplete="url" id="socialUrl" placeholder="https://example.com/your-social-page" required="" type="url"/></div>
</section>
<section class="pm-form-section">
<h4><i class="bi bi-image"></i> 2. Social Image</h4>
<div class="social-current-preview" hidden="" id="socialCurrentPreview"><span>Current image</span><img alt="Current social image preview" id="socialPreviewImage"/></div>
<label class="pm-upload-zone" for="socialImage"><i class="bi bi-cloud-arrow-up"></i><span>Drag and drop an image here, or <b>click to browse</b></span><small>PNG, JPG, WEBP or GIF · Image is required when creating</small><input accept=".jpg,.jpeg,.png,.webp,.gif,image/jpeg,image/png,image/webp,image/gif" id="socialImage" type="file"/></label>
<div class="social-file-name" id="socialFileName">No new image selected.</div>
</section>
<div class="pm-modal-actions"><button class="clean-btn" id="socialReset" type="button">Cancel</button><button class="clean-btn primary" id="socialSubmitBtn" type="submit">Create Social Link</button></div>
</form>
</div>
</div>
