<body class="report-body vip-log-page vip-exp-log-page bo-charcoal bo-account-chip">

<aside class="report-sidebar" id="reportSidebar">
<div class="report-brand">
<div>Backoffice</div><button class="close-side" data-close-sidebar=""><i class="bi bi-x-lg"></i></button>
</div>

<select id="vipLogSource" aria-label="Source">
<option value="">All Sources</option>
<option>DEPOSIT</option>
<option>VALID_BET</option>
<option>REGISTRATION</option>
<option>FIRST_DEPOSIT</option>
<option>DAILY_LOGIN</option>
<option>MANUAL</option>
<option>PROMOTION</option>
</select>
</div>
<button class="mad-btn mad-btn-primary" type="button" id="vipAdjustOpen"><i class="bi bi-plus-slash-minus"></i> Adjust EXP</button>
</div>
<div class="vip-admin-table-wrap">
<div class="vip-tx-table-head">
<table class="vip-admin-table vip-admin-table-head">
<colgroup>
<col style="width:140px"/><col style="width:150px"/><col style="width:130px"/><col style="width:88px"/><col style="width:88px"/><col style="width:88px"/><col style="width:200px"/><col/>
</colgroup>
<thead>
<tr>
<th>Date</th>
<th>Member</th>
<th>Source</th>
<th>EXP</th>
<th>Before</th>
<th>After</th>
<th class="vip-col-reference">Reference</th>
<th class="vip-col-remark">Remark</th>
</tr>
</thead>
</table>
</div>
<div class="vip-tx-table-body" id="vipLogTableScroll">

<colgroup>
<col style="width:140px"/><col style="width:150px"/><col style="width:130px"/><col style="width:88px"/><col style="width:88px"/><col style="width:88px"/><col style="width:200px"/><col/>
</colgroup>
<tbody id="vipExpLogBody">
<tr>
<td class="vip-log-empty" colspan="8">Loading…</td>
</tr>
</tbody>
</table>
</div>
</div>
<div class="table-footer">
<div class="entries-control">Show <select id="vipLogPageSize" aria-label="Rows per page">

<option value="20">20</option>
<option value="50">50</option>
<option value="100">100</option>
<option value="All">All</option>
</select> entries</div>
<div class="table-info" id="vipLogPageInfo">Showing 0 to 0 of 0 entries</div>
<div class="pagination-clean" id="vipLogPagination"></div>

<div>
<h3 id="vipAdjustTitle">Manual VIP EXP Adjustment</h3>
<p>Add a positive amount or deduct using a negative amount. Every change is audited.</p>
</div><button data-close-adjust="" type="button" aria-label="Close"><i class="bi bi-x-lg"></i></button>
</div>
<form id="vipAdjustForm">
<div class="vip-form-grid"><label>Member ID<input id="vipAdjustMemberId" min="1" required="" type="number"/></label><label>EXP Amount<input id="vipAdjustAmount" placeholder="Example: 500 or -300" required="" type="number"/></label><label class="wide">Reason<textarea id="vipAdjustReason" placeholder="Compensation, correction, fraud deduction..." required=""></textarea></label></div>
<div class="vip-dialog-actions"><button class="mad-btn mad-btn-ghost" data-close-adjust="" type="button">Cancel</button><button class="mad-btn mad-btn-primary" type="submit"><i class="bi bi-save"></i> Apply Adjustment</button></div>
</form>
</div>
