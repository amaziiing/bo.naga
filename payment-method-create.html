<body class="report-body standardized-listing-page payment-method-create-page bo-wallet-tx bo-account-chip">
<div class="report-shell">
<aside class="report-sidebar" id="reportSidebar">
<div class="report-brand"><div>Backoffice</div><button class="close-side" data-close-sidebar=""><i class="bi bi-x-lg"></i></button></div>
<nav class="report-nav"></nav>
</aside>
<div class="sidebar-overlay" data-close-sidebar="" id="reportOverlay"></div>
<main class="report-main">
<header class="report-topbar" data-bo-topbar data-bo-title="Create Payment Method" data-bo-icon="bi-plus-lg" data-bo-h1-id="pmPageTitle"></header>
<script src="assets/js/bo-topbar.js?v=a7466d81"></script>
<section class="report-content pmc-workspace">
<form class="pmc-form" id="pmForm" novalidate>
<input id="pmId" type="hidden"/>
<header class="pmc-form-head">
<a class="clean-btn" id="pmBackLink" href="bank-deposit-usage.html"><i class="bi bi-arrow-left"></i> Back</a>
</header>

<section class="pm-form-section pmc-card" id="pmAccountSection">
<h4><i class="bi bi-wallet2"></i> <span id="pmBasicSectionTitle">1. Method &amp; Account</span></h4>
<div class="pm-form-grid pm-grid-basic-top">
<div class="field is-type"><label>Method Type <b>*</b></label><select id="pmType"><option value="ONLINE_BANKING">Online Banking</option><option value="EWALLET">E-Wallet</option><option value="CARD">Card</option><option value="CASH">Cash</option></select></div>
<div class="field is-account"><label id="pmAccountNameLabel">Account Name <b>*</b></label><input id="pmAccountName" placeholder="e.g. Main Account"/></div>
<div class="field is-bank"><label id="pmBankNameLabel">Bank Name <b>*</b></label><input id="pmBankName" placeholder="e.g. Test Bank"/></div>
<div class="field is-account-no"><label id="pmAccountNoLabel">Account Number <b>*</b></label><input id="pmAccountNo" placeholder="e.g. 001234567"/></div>
</div>
<div class="pm-form-grid pm-grid-basic-bottom">
<div class="field is-bsb"><label>Bank BSB</label><input id="pmBsb" placeholder="e.g. 123-456"/></div>
<div class="field is-name"><label>Display Name <b>*</b></label><input id="pmName" placeholder="e.g. Test Bank"/></div>
<div class="field is-subtitle"><label>Subtitle</label><input id="pmSubtitle" placeholder="e.g. Fast deposit"/></div>
<div class="pm-status-show-pair">
<div class="field is-compact is-status"><label>Status <b>*</b></label><select id="pmStatus"><option value="1">Active</option><option value="0">Suspend</option></select></div>
<div class="field is-compact is-show"><label>Show Bank <b>*</b></label><select id="pmVisible"><option value="1">Show</option><option value="0">Hide</option></select></div>
</div>
</div>
</section>

<section class="pm-form-section pmc-card">
<h4><i class="bi bi-sliders"></i> 2. Limits &amp; Order</h4>
<div class="pm-form-grid pm-grid-4">
<div class="field"><label>Pay ID</label><input id="pmPayId" placeholder="e.g. PAY123"/></div>
<div class="field"><label>Sort Order <b>*</b></label><input id="pmSort" placeholder="e.g. 0" type="number" value="0"/></div>
<div class="field"><label>Min Amount <b>*</b></label><input id="pmMin" placeholder="e.g. 10.00" step="0.01" type="number" value="10"/></div>
<div class="field"><label>Max Amount <b>*</b></label><input id="pmMax" placeholder="e.g. 0.00" step="0.01" type="number" value="0"/></div>
<div class="field"><label>Visible to VIP Tier</label><input id="pmVipTiers" placeholder="e.g. 0,1,2 or VIP1,VIP2"/></div>
<div class="field"><label>Daily Deposit Threshold</label><input id="pmDailyLimit" min="0" step="0.01" type="number" value="0"/></div>
<div class="field"><label>At Threshold</label><select id="pmAutoRotate"><option value="0">Keep visible</option><option value="1">Auto hide and rotate to next bank</option></select></div>
</div>
</section>

<section class="pm-form-section pmc-card">
<h4><i class="bi bi-qr-code"></i> 3. QR / E-wallet Image</h4>
<label class="pm-upload-zone" for="pmQr"><i class="bi bi-cloud-arrow-up"></i><span>Drag and drop an image here, or <b>click to browse</b></span><small>PNG, JPG or WEBP · Max size 2MB · Recommended 512×512px</small><input accept="image/*" id="pmQr" type="file"/></label>
</section>

<section class="pm-form-section pmc-card">
<h4><i class="bi bi-card-text"></i> 4. Instructions</h4>
<div class="field"><textarea id="pmInstructions" maxlength="500" placeholder="Payment instructions shown on Naga deposit page..." rows="4"></textarea></div>
</section>
</form>

<footer class="pmc-sticky-footer" id="pmcStickyFooter">
<div class="pmc-footer-actions">
<a class="clean-btn" id="pmCancelBtn" href="bank-deposit-usage.html">Cancel</a>
<button class="clean-btn primary" id="pmSubmitBtn" form="pmForm" type="submit"><i class="bi bi-check-lg" aria-hidden="true"></i> Create Payment Method</button>
</div>
</footer>
</section>
</main>
