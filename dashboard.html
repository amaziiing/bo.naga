<style>
html:has(body.dashboard-shell),body.dashboard-shell{height:100%;overflow:hidden!important}
body.dashboard-shell .report-main{height:100vh;min-height:0;overflow:hidden!important}
.dashboard-workspace{padding:0!important;width:100%!important;max-width:100%!important;min-width:0!important;height:calc(100vh - 42px);min-height:0;background:transparent;overflow:hidden!important;position:relative!important}
.dashboard-workspace-frame{display:block;position:absolute!important;inset:0;width:100%!important;max-width:100%!important;min-width:0!important;height:100%!important;min-height:0;border:0;background:transparent;overflow:hidden;opacity:0;pointer-events:none;z-index:1;transition:opacity .15s ease}
.dashboard-workspace-frame[hidden]{display:none!important}
.dashboard-workspace-frame.is-bo-frame-active{opacity:1;pointer-events:auto;z-index:2}
.dashboard-workspace-frame.is-bo-frame-pending{opacity:0!important;pointer-events:none!important;transition:none!important}

/* Dashboard shell only: remove the old top header and keep the sidebar toggle inside the sidebar. */
.dashboard-hidden-topbar{display:none!important;height:0!important;min-height:0!important;padding:0!important;margin:0!important;border:0!important}
.dashboard-sidebar-brand{justify-content:space-between!important}
.dashboard-sidebar-toggle{display:inline-flex!important;align-items:center!important;justify-content:center!important;width:42px!important;height:42px!important;min-width:42px!important;padding:0!important;border:1px solid var(--line,#EADCC8)!important;border-radius:11px!important;background:#FFF8EB!important;color:#18191C!important;cursor:pointer!important;pointer-events:auto!important}
.dashboard-sidebar-toggle i{font-size:22px!important}
@media(min-width:992px){
  body.sidebar-mini .dashboard-sidebar-brand{justify-content:center!important;padding:0!important}
  body.sidebar-mini .dashboard-sidebar-brand>div{display:none!important}
  body.sidebar-mini .dashboard-sidebar-toggle{display:inline-flex!important;opacity:1!important;visibility:visible!important;width:42px!important;min-width:42px!important}
  /* 2026-09-24: the collapsed rail does not slide out on hover any more, so the brand row
     must not resurrect its text on hover either — it used to reappear (clipped) inside the
     72px rail, which reads as the sidebar expanding by itself. The reveal is kept for the
     expanded rail, where the text is visible anyway, and `dashboard-mini-hold` below still
     covers the frame right after a collapse click. */
  body:not(.sidebar-mini) .report-sidebar:hover .dashboard-sidebar-brand,
  body:not(.sidebar-mini) .report-sidebar.is-mini-hover .dashboard-sidebar-brand{justify-content:space-between!important;padding:0 14px!important}
  body:not(.sidebar-mini) .report-sidebar:hover .dashboard-sidebar-brand>div,
  body:not(.sidebar-mini) .report-sidebar.is-mini-hover .dashboard-sidebar-brand>div{display:block!important;opacity:1!important;visibility:visible!important;width:auto!important}
}
@media(max-width:991.98px){.dashboard-sidebar-toggle{display:inline-flex!important}.dashboard-sidebar-brand .close-side{display:inline-flex!important}}
@media(min-width:992px){
  /* After clicking the Dashboard sidebar toggle, keep the rail visibly collapsed until
     the pointer leaves it. This prevents the normal hover-to-expand rule from making
     the click look like it did nothing. Hover behaviour resumes on the next hover. */
  body.sidebar-mini.dashboard-mini-hold .report-sidebar,
  body.sidebar-mini.dashboard-mini-hold .report-sidebar:hover,
  body.sidebar-mini.dashboard-mini-hold .report-sidebar.is-mini-hover{width:var(--rail-w)!important;max-width:var(--rail-w)!important;min-width:var(--rail-w)!important;box-shadow:none!important;overflow-x:hidden!important}
  body.sidebar-mini.dashboard-mini-hold .report-sidebar:hover .report-brand{justify-content:center!important;padding:0!important}
  body.sidebar-mini.dashboard-mini-hold .report-sidebar:hover .report-brand>div:not(.logo),
  body.sidebar-mini.dashboard-mini-hold .report-sidebar:hover .report-nav>a:not(.report-sub) span,
  body.sidebar-mini.dashboard-mini-hold .report-sidebar:hover .nav-group-btn span,
  body.sidebar-mini.dashboard-mini-hold .report-sidebar:hover .nav-group-btn .bi-chevron-down,
  body.sidebar-mini.dashboard-mini-hold .report-sidebar:hover .report-nav small{opacity:0!important;visibility:hidden!important;width:0!important;overflow:hidden!important}
  body.sidebar-mini.dashboard-mini-hold .report-sidebar:hover .report-nav>a:not(.report-sub),
  body.sidebar-mini.dashboard-mini-hold .report-sidebar:hover .nav-group-btn{justify-content:center!important;padding-left:0!important;padding-right:0!important}
}
</style>

<script>
/* Dashboard-only: make the sidebar button collapse immediately even while the pointer
   is still sitting over the sidebar. No shared sidebar behaviour is changed. */
(function(){
  var sidebar=document.getElementById('reportSidebar');
  var toggle=document.querySelector('.dashboard-sidebar-toggle');
  if(!sidebar||!toggle) return;
  toggle.addEventListener('pointerdown',function(){
    if(window.innerWidth>=992 && !document.body.classList.contains('sidebar-mini')){
      document.body.classList.add('dashboard-mini-hold');
    }
  });
  sidebar.addEventListener('mouseleave',function(){
    document.body.classList.remove('dashboard-mini-hold');
  });
  window.addEventListener('resize',function(){
    if(window.innerWidth<992) document.body.classList.remove('dashboard-mini-hold');
  });
})();
</script>
