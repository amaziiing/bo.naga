  try{

  }catch(e){}
})();

<body class="report-body standardized-listing-page promotion-log-page bo-wallet-tx bo-account-chip">
<div class="report-shell">
<aside class="report-sidebar" id="reportSidebar">
<div class="report-brand">
<div>Backoffice</div><button class="close-side" data-close-sidebar=""><i class="bi bi-x-lg"></i></button>
</div>
<nav class="report-nav"></nav>
</aside>
<div class="sidebar-overlay" data-close-sidebar="" id="reportOverlay"></div>
<main class="report-main">
<header class="report-topbar"><button class="hamb" data-open-sidebar=""><i class="bi bi-list"></i></button>
<div class="user-title-wrap">
<div class="user-title-icon"><i class="bi bi-journal-text"></i></div>
<div>
<h1>Promotion Log</h1>
</div>
</div>
<div class="report-actions">
      <button type="button" class="bo-theme-btn" id="boThemeToggle" aria-pressed="false" title="Switch to dark mode" aria-label="Switch to dark mode">
        <i class="bi bi-sun-fill" data-theme-icon="sun"></i>
        <i class="bi bi-moon-fill" data-theme-icon="moon" hidden></i>
      </button>
      <div data-bo-profile></div>
    </div>
</header>
<section class="report-content">
<div class="quick-stats pl-kpis">
<div class="metric">
<div class="bo-summary-icon"><i class="bi bi-clipboard2-check"></i></div>
<span>Total Claims</span><strong id="dbgTotal">0</strong>
<div class="bo-summary-note">In this range</div>
</div>
<div class="metric">
<div class="bo-summary-icon"><i class="bi bi-lightning-charge"></i></div>
<span>Active</span><strong id="dbgActive">0</strong>
<div class="bo-summary-note">Still rolling</div>
</div>
<div class="metric">
<div class="bo-summary-icon"><i class="bi bi-check-circle"></i></div>
<span>Completed</span><strong id="dbgCompleted">0</strong>
<div class="bo-summary-note">Requirement met</div>
</div>
<div class="metric">
<div class="bo-summary-icon"><i class="bi bi-x-octagon"></i></div>
<span>Forfeited</span><strong id="dbgForfeited">0</strong>
<div class="bo-summary-note">Stopped early</div>
</div>
</div>
<div class="table-card promotion-log-card">
<div class="promotion-log-ops filter-card deposit-inline-filter wallet-inline-filter">
<div class="bo-tx-toolbar pl-toolbar">
<nav class="bo-tx-tabs bo-seg" aria-label="Claim status" data-bo-seg-anim="bounce" id="dbgStatusTabs">
<button type="button" class="bo-tx-tab is-active" data-pl-status="ACTIVE" aria-pressed="true">Active <span class="bo-tx-tab-count" id="plTabCountActive">0</span></button>
<button type="button" class="bo-tx-tab" data-pl-status="COMPLETED" aria-pressed="false">Completed <span class="bo-tx-tab-count" id="plTabCountCompleted">0</span></button>
<button type="button" class="bo-tx-tab" data-pl-status="FORFEITED" aria-pressed="false">Forfeited <span class="bo-tx-tab-count" id="plTabCountForfeited">0</span></button>
<button type="button" class="bo-tx-tab" data-pl-status="" aria-pressed="false">All <span class="bo-tx-tab-count" id="plTabCountAll">0</span></button>
</nav>
<div class="user-search-grid bo-filter-row bo-tx-filter-controls">
<div class="field"><label>From</label><input id="dbgFrom" type="date"/></div>
<div class="field"><label>To</label><input id="dbgTo" type="date"/></div>
<div class="field keyword-field"><label>Search</label><input id="dbgKeyword" placeholder="Member, mobile, or promotion ID" autocomplete="off"/></div>
<div class="field pl-toolbar-actions"><label> </label><div class="filter-action-row pl-toolbar-row"><button class="clean-btn" id="dbgSyncBetLogsBtn" type="button"><i class="bi bi-database-check"></i> Sync Bet Logs</button><button class="clean-btn" id="dbgRefreshBtn" type="button"><i class="bi bi-arrow-clockwise"></i> Refresh</button><a class="clean-btn primary" href="promotion.html"><i class="bi bi-plus-lg"></i> Create Promotion</a></div></div>
</div>
</div>
<div class="debug-status" id="dbgMsg" aria-live="polite" hidden></div>
</div>
<div class="table-wrap">
<table class="report-table">
<thead>
<tr>
<th>ID</th>
<th>Member</th>
<th>Promotion</th>
<th>Bonus</th>
<th>Turnover</th>
<th>Rollover</th>
<th>Status</th>
<th>Created</th>
<th>Action</th>
</tr>
</thead>
<tbody id="dbgRows">
<tr>
<td colspan="9">Loading...</td>
</tr>
</tbody>
</table>
</div>
<div class="table-footer standard-pagination pl-table-footer">
<div class="entries-control">Show
<select id="dbgPageSize" aria-label="Show entries">
<option value="-" selected>-</option>
<option value="10">10</option>
<option value="20">20</option>
<option value="50">50</option>
<option value="100">100</option>
<option value="All">All</option>
</select>
entries</div>
<div class="table-info" id="dbgShowing">Showing 0 to 0 of 0 entries</div>
<nav class="pagination-clean mad-pager" id="dbgPager" aria-label="Table pagination"></nav>
</div>
</div>
</section>
</main>
</div>
