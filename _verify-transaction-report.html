  loadMenuGroups: function () { return Promise.resolve(); }
};
(function () {
  var now = Date.now();
  var remarks = ["Player exit transfer back PLAYBOY session #900", "Player launch PLAYBOY / 3207",
    "Transfer to provider PLAYBOY", "Transfer back from provider PLAYBOY", "Player launch PXPLAY / pgs-fortune-dragon",
    "Player exit transfer back PXPLAY session #899", "Player launch PXPLAY / hs-franks-farm"];
  function rowsFor(dir, n) {
    var out = [];
    for (var i = 0; i < n; i++) {
      out.push({
        id: "2026081209" + String(300000 + i),
        memberId: [15, 1, 1, 15, 15, 2207][i % 6],
        ledgerType: dir,
        walletBucket: "MAIN",
        amount: dir === "TRANSFER_IN" ? 10 : -10,
        beforeBalance: 58123.12 + i * 37.5,
        afterBalance: 58133.12 + i * 37.5,
        createdBy: "-", approvedBy: "-", reasonCode: "-",
        referenceNo: "T0010" + (200 + i),
        remark: remarks[i % remarks.length],
        createdAt: new Date(now - i * 60000).toISOString(),
        postedAt: new Date(now - i * 60000).toISOString()
      });
    }
    return out;
  }
  var OUT = rowsFor("TRANSFER_OUT", 34), IN = rowsFor("TRANSFER_IN", 31);
  window.fetch = function (input) {
    var url = typeof input === "string" ? input : (input && input.url) || "";
    var data = /TRANSFER_OUT/.test(url) ? OUT : IN;
    return Promise.resolve(new Response(JSON.stringify({ status: "ok", data: data }), { status: 200,
      headers: { "Content-Type": "application/json" } }));
  };
})();
</script>
