              </div>

                <a class="clean-btn" href="animation-effect.html" title="Configure animations for Site Customize images"><i class="bi bi-stars"></i> Asset Animation</a>

              <button class="custom-tab" type="button" data-locale="my" aria-selected="false">MY</button>
            </div>

            <div class="custom-tab-panel active" id="main-layout" data-assets-locale="en">
