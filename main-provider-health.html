<div class="report-shell">
<aside class="report-sidebar" id="reportSidebar">
<div class="report-brand"><div>Backoffice</div><button class="close-side" data-close-sidebar=""><i class="bi bi-x-lg"></i></button></div>
<nav class="report-nav"></nav><script>window.boShellBoot&&window.boShellBoot()</script>
</aside>
<div class="sidebar-overlay" data-close-sidebar="" id="reportOverlay"></div>
<main class="report-main">
<header class="report-topbar">
  <button class="hamb" data-open-sidebar=""><i class="bi bi-list"></i></button>
  <div class="user-title-wrap">
    <div class="user-title-icon"><i class="bi bi-hdd-network"></i></div>
    <div>
      <h1>Providers</h1>
    </div>
  </div>
  <div class="report-actions">
    <button type="button" class="bo-theme-btn" id="boThemeToggle" aria-pressed="false" title="Switch to dark mode" aria-label="Switch to dark mode">
      <i class="bi bi-sun-fill" data-theme-icon="sun"></i>
      <i class="bi bi-moon-fill" data-theme-icon="moon" hidden></i>
    </button>
    <div data-bo-profile=""></div>
  </div>
</header>

<section class="report-content mad-workspace">
  <div class="mad-chrome">
    <div class="mad-tabs" role="tablist" aria-label="Provider sections">
      <a class="mad-tab" role="tab" aria-selected="false" href="main-provider-detail.html">Providers</a>
      <a class="mad-tab" role="tab" aria-selected="false" href="main-provider-credentials.html">Settlement</a>
      <a class="mad-tab is-active" role="tab" aria-selected="true" href="main-provider-health.html">Activity Logs</a>
    </div>
    <div class="mad-chrome-actions" aria-hidden="true"></div>
  </div>
  <div class="mad-panel">
    <div class="settlement-ledger-head">
      <div class="d-flex gap-2 align-items-center flex-wrap">
        <div class="field mpa-actor-field"><label class="bo-search-control"><i class="bi bi-search" aria-hidden="true"></i><input id="mpaActor" aria-label="Search performed by" placeholder="Search performed by"/></label></div>
        <div class="field ref-date-field mpa-date-field">
          <input type="hidden" id="reportDateFrom"/>
          <input type="hidden" id="reportDateTo"/>
          <div class="ref-range-wrap">
            <button class="ref-range-trigger" id="reportDateTrigger" type="button" aria-label="Date range">
              <span class="ref-range-icon"><i class="bi bi-calendar3"></i></span>
              <span id="reportDateLabel">Select date range</span>
              <i class="bi bi-chevron-down ms-auto"></i>
            </button>
            <div class="ref-range-picker" id="reportRangePicker">
              <div class="ref-range-presets">
                <button type="button" data-report-preset="today">Today</button>
                <button type="button" data-report-preset="yesterday">Yesterday</button>
                <button type="button" data-report-preset="thisWeek">This Week</button>
                <button type="button" data-report-preset="lastWeek">Last Week</button>
                <button type="button" data-report-preset="thisMonth">This Month</button>
                <button type="button" data-report-preset="lastMonth">Last Month</button>
                <button type="button" data-report-preset="thisYear">This Year</button>
                <button type="button" data-report-preset="lastYear">Last Year</button>
              </div>
              <div class="ref-range-calendar">
                <div class="ref-cal-head">
                  <button type="button" id="reportCalPrev" aria-label="Previous month"><i class="bi bi-chevron-left"></i></button>
                  <button type="button" class="ref-head-pick" id="reportCalMonth" aria-label="Choose month"></button>
                  <button type="button" class="ref-head-pick" id="reportCalYear" aria-label="Choose year"></button>
                  <button type="button" id="reportCalNext" aria-label="Next month"><i class="bi bi-chevron-right"></i></button>
                </div>
                <div class="ref-cal-month-grid" id="reportCalMonthGrid"></div>
                <div class="ref-cal-year-grid" id="reportCalYearGrid"></div>
                <div class="ref-cal-day-view" id="reportCalDayView">
                  <div class="ref-cal-week"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
                  <div class="ref-cal-days" id="reportCalDays"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <button class="mad-btn mad-btn-ghost" id="mpaRefresh" type="button"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
    </div>
    <div class="mad-table-wrap"><table class="mad-table"><thead><tr><th>Date &amp; Time</th><th>Provider / Target</th><th>Action</th><th>Performed By</th><th>Details</th><th>IP Address</th><th>Status</th></tr></thead><tbody id="mpaRows"><tr><td colspan="7" class="mad-empty">Loading activity...</td></tr></tbody></table></div>
    <div class="mad-footer">
      <label class="mad-page-size-control entries-control" for="mpaEntriesPageSize">Show
        <select id="mpaEntriesPageSize" class="mad-page-size-select" aria-label="Rows per page">
          <option value="-" selected>-</option>
          <option value="10">10</option>
          <option value="20">20</option>
          <option value="50">50</option>
          <option value="100">100</option>
          <option value="All">All</option>
        </select>
        <span>entries</span>
      </label>
      <div class="mad-footer-info" id="mpaInfo">Showing 0 to 0 of 0 entries</div>
      <div class="mad-footer-right">
        <nav class="mad-pager" id="mpaPager" aria-label="Table pagination"></nav>
      </div>
    </div>
  </div>
</section>
