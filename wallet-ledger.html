/* 2026-10-02 — Member Wallet recipe for a table that cannot fit the card:
   px column widths (measured), `width:max(100%,2056px)`, H-scroll inside
   `.bo-tx-table-body`, fixed head that follows the body's scrollLeft and can be
   dragged. Measured on the rendered page at 1568×900 before: 9 of 15 headings and
   11 of 15 cells were clipped. The old block forced `width:100%` + nth-child
   percentages, which is what truncated MEMBER/PROVIDER/AMOUNT/REMARK. */
.wallet-ledger-page .table-wrap{
  width:100%!important;
  max-width:100%!important;
  overflow:hidden!important;
  display:flex!important;
  flex-direction:column!important;
  min-height:0!important;
}

  flex:0 0 auto!important;
  overflow:hidden!important;
  scrollbar-gutter:stable!important;
  cursor:grab;
}
.wallet-ledger-page .bo-tx-table-body{
  flex:1 1 auto!important;
  min-height:0!important;
  overflow-x:auto!important;
  overflow-y:auto!important;
  scrollbar-gutter:stable!important;
  cursor:grab;
}
.wallet-ledger-page .bo-tx-table-body.is-hdrag,
.wallet-ledger-page .bo-tx-table-head.is-hdrag,

/* Panel pill scrollbar, BOTH axes (6px · chocolate light / amber dark · no arrows).
   The head declares the same 6px bar it reserves via scrollbar-gutter, so the two
   slots keep the same client width and the columns stay locked. */

.wallet-ledger-page .bo-tx-table-body::-webkit-scrollbar-button{display:none!important;height:0!important;width:0!important}
