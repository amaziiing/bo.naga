  <body class="report-body livechat-bo-page bo-charcoal bo-account-chip">
    <div class="report-shell">
      <aside class="report-sidebar" id="reportSidebar">
        <div class="report-brand">
          <div>Backoffice</div>
          <button class="close-side" data-close-sidebar><i class="bi bi-x-lg"></i></button>
        </div>
        <nav class="report-nav"></nav>
      </aside>
      <div class="sidebar-overlay" id="reportOverlay" data-close-sidebar></div>
      <main class="report-main">
        <header class="report-topbar" data-bo-topbar data-bo-title="Live Chat" data-bo-icon="bi-chat-dots" data-bo-hamb-aria="Toggle sidebar"></header>
<script src="assets/js/bo-topbar.js?v=1"></script>
        <section class="report-content">
          <div class="livechat-admin-shell">
            <aside class="livechat-inbox-card">
              <div class="livechat-card-head">
                <div>
                  <h3>Conversations <span class="livechat-inbox-total" id="livechatInboxTotal"></span></h3>
                </div>
                <button class="clean-btn" type="button" id="livechatRefreshBtn" aria-label="Refresh conversations"><i class="bi bi-arrow-clockwise"></i></button>
              </div>
              <div class="livechat-search">
                <i class="bi bi-search" aria-hidden="true"></i>
                <input id="livechatSearch" placeholder="Search member name / username" autocomplete="off">
              </div>
              <div class="livechat-inbox-list" id="livechatInboxList">
                <div class="livechat-empty">
                  <span class="livechat-empty-icon"><i class="bi bi-chat-dots"></i></span>
                  <strong>Loading conversations</strong>
                </div>
              </div>
            </aside>
            <section class="livechat-room-card">
              <div class="livechat-room-head" id="livechatRoomHead">
                <div class="livechat-room-id">
                  <div class="livechat-room-avatar">?</div>
                  <div class="livechat-room-id-copy">
                    <h2>Select a conversation</h2>
                    <p>Choose a member from the inbox to start reply.</p>
                  </div>
                </div>
              </div>
              <div class="livechat-room-thread">
              <div class="livechat-room-messages" id="livechatMessages">
                <div class="livechat-empty big">
                  <span class="livechat-empty-icon"><i class="bi bi-chat-dots"></i></span>
                  <strong>Select a conversation</strong>
                  <span>Choose a member from the inbox to start reply.</span>
                </div>
              </div>
              </div>
              <form class="livechat-compose" id="livechatForm">
                <div class="livechat-reply-well">
                  <div class="livechat-template-box">
                    <div class="livechat-template-panel" id="livechatTemplatePanel"></div>
                    <a class="clean-btn small livechat-template-manage" href="livechat-template.html"><i class="bi bi-gear"></i> Manage</a>
                  </div>
                  <div class="livechat-attach-preview" id="livechatAttachPreview"></div>
                  <div class="livechat-edit-state" id="livechatEditState"><span><i class="bi bi-pencil-square"></i> Editing message</span><button class="livechat-edit-cancel" id="livechatEditCancel" type="button" aria-label="Cancel edit">&times;</button></div>
                  <textarea id="livechatInput" rows="2" placeholder="Type a reply or click a template"></textarea>
                  <div class="livechat-compose-actions">
                    <button class="clean-btn" type="button" id="livechatAttachBtn" aria-label="Attach file"><i class="bi bi-paperclip"></i> <span>Attach</span></button>
                    <input type="file" id="livechatFileInput" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt,.zip" hidden>
                    <button class="btn-primary-clean" type="submit"><i class="bi bi-send"></i> Send</button>
                  </div>
                </div>
              </form>
            </section>
          </div>
        </section>
      </main>
    </div>
