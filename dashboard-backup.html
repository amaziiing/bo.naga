    <style>
        /* Dashboard only: keep date range on the left and pin timezone to the far right. */
        .report-main .report-content > .ops-filter {
            position: relative !important;
            display: block !important;
            width: 100% !important;
            min-height: 96px !important;
            padding-right: 330px !important;
        }
        .report-main .report-content > .ops-filter .dash-date-field {
            width: 390px !important;
            max-width: 100% !important;
            min-width: 0 !important;
            margin: 0 !important;
        }
        .report-main .report-content > .ops-filter .dashboard-timezone-clock {
            position: absolute !important;
            right: 20px !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            margin: 0 !important;
            white-space: nowrap !important;
            text-align: right !important;
        }
        @media (max-width: 900px) {
            .report-main .report-content > .ops-filter {
                padding-right: 16px !important;
                padding-bottom: 16px !important;
                min-height: 0 !important;
            }
            .report-main .report-content > .ops-filter .dash-date-field {
                width: 100% !important;
            }
            .report-main .report-content > .ops-filter .dashboard-timezone-clock {
                position: static !important;
                display: block !important;
                width: 100% !important;
                margin: 14px 0 0 !important;
                transform: none !important;
                white-space: normal !important;
                overflow-wrap: anywhere !important;
                text-align: right !important;
                line-height: 1.35 !important;
                text-align: right !important;
            }
        }
    </style>
</head>

<body class="report-body bo-charcoal bo-account-chip">
    <div class="report-shell">
        <aside class="report-sidebar" id="reportSidebar">
            <div class="report-brand">
                <div>Backoffice</div><button class="close-side" data-close-sidebar><i
                        class="bi bi-x-lg"></i></button>
            </div>
            <nav class="report-nav"></nav>
        </aside>
        <div class="sidebar-overlay" data-close-sidebar></div>
        <main class="report-main">
            <header class="report-topbar"><button class="hamb" data-open-sidebar><i class="bi bi-list"></i></button>
                <div class="user-title-wrap">
                    <div class="user-title-icon"><i class="bi bi-speedometer2"></i></div>
                    <div>
                        <h1>Dashboard</h1>
                    </div>
                </div>
                <div class="report-actions">
      <button type="button" class="bo-theme-btn" id="boThemeToggle" aria-pressed="false" title="Switch to dark mode" aria-label="Switch to dark mode">
        <i class="bi bi-sun-fill" data-theme-icon="sun"></i>
        <i class="bi bi-moon-fill" data-theme-icon="moon" hidden></i>
      </button>
      <div data-bo-profile></div>
    </div>
            </header>
            <section class="report-content">
                <div class="ops-filter">
                    <div class="field ref-date-field dash-date-field"><label>Date Range</label>
                        <div class="ref-range-wrap"><button type="button" class="ref-range-trigger"
                                id="dashDateTrigger"><span class="ref-range-icon"><i
                                        class="bi bi-calendar3"></i></span><span id="dashDateLabel">Select date
                                    range</span><i class="bi bi-chevron-down ms-auto"></i></button><input id="dashFrom"
                                type="hidden"><input id="dashTo" type="hidden">
                            <div class="ref-range-picker" id="dashRangePicker">
                                <div class="ref-range-presets"><button type="button"
                                        data-dash-range-preset="today">Today</button><button type="button"
                                        data-dash-range-preset="yesterday">Yesterday</button><button type="button"
                                        data-dash-range-preset="thisWeek">This Week</button><button type="button"
                                        data-dash-range-preset="lastWeek">Last Week</button><button type="button"
                                        data-dash-range-preset="thisMonth">This Month</button><button type="button"
                                        data-dash-range-preset="lastMonth">Last Month</button><button type="button"
                                        data-dash-range-preset="thisYear">This Year</button><button type="button"
                                        data-dash-range-preset="lastYear">Last Year</button></div>
                                <div class="ref-range-calendar">
                                    <div class="ref-cal-head"><button type="button" id="dashCalPrev"><i
                                                class="bi bi-chevron-left"></i></button><button type="button"
                                            class="ref-head-pick" id="dashCalMonth"></button><button type="button"
                                            class="ref-head-pick" id="dashCalYear"></button><button type="button"
                                            id="dashCalNext"><i class="bi bi-chevron-right"></i></button></div>
                                    <div class="ref-cal-month-grid" id="dashCalMonthGrid"></div>
                                    <div class="ref-cal-year-grid" id="dashCalYearGrid"></div>
                                    <div class="ref-cal-day-view" id="dashCalDayView">
                                        <div class="ref-cal-week">
                                            <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
                                        </div>
                                        <div class="ref-cal-days" id="dashCalDays"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <span id="dashClock" class="timezone-chip dashboard-timezone-clock" aria-label="Dashboard timezone and current time"></span>
                </div>
                <br>
                <div class="ops-grid" id="dashboardCards"></div>
            </section>
        </main>
    </div>
