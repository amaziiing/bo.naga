<!DOCTYPE html>
<html lang="en" data-bo-theme="light" data-bo-spa="1">
<head>
  <meta charset="utf-8" />
  <title>MD Preview — Bonus Item List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="assets/css/reports.css?v=e2945fca" rel="stylesheet" />
  <link href="assets/css/bo-charcoal-cms.css?v=c313fb33" rel="stylesheet" />
<link href="assets/css/bo-field-standard.css?v=06f5ae19" rel="stylesheet">
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      padding: 20px;
      background: #FFF1DC;
      font-family: "Segoe UI", system-ui, sans-serif;
      box-sizing: border-box;
    }
    .report-main {
      max-width: 1100px;
      margin: 0 auto;
      height: calc(100vh - 40px);
      display: flex;
      flex-direction: column;
    }
    .page-head { margin: 0 0 14px; }
    .page-head h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      color: #18191C;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }
    .page-head p {
      margin: 6px 0 0;
      font-size: 13px;
      color: #71717A;
      text-wrap: pretty;
    }
    .report-content {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 0 !important;
    }
  </style>
</head>
<body class="report-body standardized-listing-page standardized-content-management page-bonus-category-item bo-charcoal">
  <div class="report-main">
    <div class="page-head">
      <h1>Bonus Item List</h1>
      <p>Filter by title to manage each section, like Information Center / Kick Start Bonus.</p>
    </div>
    <section class="report-content">
      <div class="manage-page-grid crud-list-only-grid">
        <div class="manage-list-card category-modern-page bonus-item-modern-page crud-list-full">
          <div class="bonus-item-panel">
            <div class="bonus-item-strip section-title slider-list-title standardized-toolbar-title category-toolbar-title bonus-item-toolbar crud-list-titlebar">
              <div class="bonus-item-filterbar" data-bo-filter-exempt="1">
                <div class="rounded-select-wrap" style="position:relative;width:min(280px,100%)">
                  <button type="button" class="rounded-select-btn" style="width:100%;height:36px;border:1px solid #EADCC8;border-radius:8px;background:#FFF8EB;padding:0 34px 0 12px;font-size:12px;font-weight:700;text-align:left;color:#18191C">KICK START BONUS</button>
                </div>
              </div>
              <div class="crud-title-actions bonus-item-actions">
                <button class="clean-btn mad-btn-ghost crud-toolbar-btn" type="button"><i class="bi bi-arrow-clockwise" aria-hidden="true"></i><span class="btn-label">Refresh</span></button>
                <button class="clean-btn primary crud-add-btn crud-toolbar-btn" type="button"><i class="bi bi-plus-circle" aria-hidden="true"></i><span class="btn-label">Add Bonus Category Item</span></button>
              </div>
            </div>
            <div class="category-table-wrap bonus-item-table-wrap">
              <div class="standard-list-head bonus-item-list-head bonus-item-table-head" role="row">
                <span>Bonus Item</span>
                <span>Layout / Details</span>
                <span>Status</span>
                <span>Actions</span>
              </div>
              <div class="slider-empty" id="bonusItemEmpty">
                <i class="bi bi-card-image" aria-hidden="true"></i>
                <b>No bonus items found</b>
                <small>Create your first bonus item.</small>
              </div>
              <div class="manage-list standardized-card-list bonus-item-table" id="bonusItemList" role="rowgroup" hidden></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
<script src="assets/js/bo-spa.js?v=1005ed5c"></script>
</body>
</html>
