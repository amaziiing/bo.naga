<div class="field"><label>To</label><input class="form-control" id="usageTo" type="date"/></div>
<div class="field bank-usage-keyword-field"><label>Bank / Display Name</label><label class="bo-search-control"><i class="bi bi-search" aria-hidden="true"></i><input class="form-control" id="usageKeyword" placeholder="Search bank or account"/></label></div>
</div>
<a class="clean-btn primary" href="payment-method-create.html?from=usage"><i class="bi bi-plus-lg"></i> Create Payment Method</a>
<button class="clean-btn" id="usageRefresh" type="button"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
</div>

<tbody id="usageBody"><tr><td colspan="11">Loading...</td></tr></tbody>
</table>
</div>
<div class="table-footer">
<div class="table-info" id="usageInfo">Loading bank usage...</div>

</div>
