<body class="report-body admin-management-page bo-charcoal bo-account-chip bo-access-control">
<div class="report-shell">
<aside class="report-sidebar" id="reportSidebar">
<div class="report-brand">
<div>Backoffice</div><button class="close-side" data-close-sidebar=""><i class="bi bi-x-lg"></i></button>
</div>
<nav class="report-nav"></nav>

<header class="report-topbar admin-page-topbar" data-bo-topbar data-bo-title="Admin Management" data-bo-icon="bi-person-gear" data-bo-title-block-class="user-title-block"><span data-bo-topbar-title-extra class="users-found-badge" id="adminCountBadge">0 Accounts</span></header>
<script src="assets/js/bo-topbar.js?v=a7466d81"></script>
<section class="report-content admin-management-page">
<div class="quick-stats user-stats admin-stats">
<div class="user-metric purple"><span class="metric-icon"><i class="bi bi-people"></i></span><div><span>Total Admin</span><strong id="adminStatTotal">0</strong><small>All admin accounts</small></div></div>
<div class="user-metric green"><span class="metric-icon"><i class="bi bi-check-circle-fill"></i></span><div><span>Active</span><strong id="adminStatActive">0</strong><small>Active accounts</small></div></div>
<div class="user-metric orange"><span class="metric-icon"><i class="bi bi-lock-fill"></i></span><div><span>Disabled</span><strong id="adminStatDisabled">0</strong><small>Disabled accounts</small></div></div>
<div class="user-metric blue"><span class="metric-icon"><i class="bi bi-clock"></i></span><div><span>Last Login Today</span><strong id="adminStatLoginToday">0</strong><small>Accounts logged in today</small></div></div>
</div>
<div class="table-card admin-list-card">
<div class="user-toolbar">
<div class="mad-pills ac-status-pills" role="group" aria-label="Status filter" data-bo-seg-anim="bounce">
<button type="button" class="mad-pill is-active" data-mad-status="active" aria-pressed="true">Active <span class="mad-pill-count is-active-count" id="adminCountActive">0</span></button>
<button type="button" class="mad-pill" data-mad-status="suspended" aria-pressed="false">Disabled <span class="mad-pill-count is-danger-count" id="adminCountDisabled">0</span></button>
<button type="button" class="mad-pill" data-mad-status="all" aria-pressed="false">All <span class="mad-pill-count" id="adminCountAll">0</span></button>
</div>
<div class="user-search-grid admin-search-grid bo-filter-row">
<div class="field">
<label class="bo-search-control"><i class="bi bi-search" aria-hidden="true"></i><input id="adminSearchInput" aria-label="Search username or display name" placeholder="Search username or display name"/></label>
</div>
<div class="field">
<label>Role</label>
<select id="adminRoleFilter"><option value="">All Roles</option></select>
</div>
</div>
<div class="user-toolbar-actions"><a class="clean-btn primary" id="openCreateAdminBtn" href="admin-user-create.html"><i class="bi bi-person-plus"></i> Add Admin</a><button class="clean-btn" id="exportAdminBtn" type="button"><i class="bi bi-download"></i> Export</button></div>
</div>
<div class="table-wrap">
<table class="report-table table-clean user-main-table admin-main-table">
<thead>
<tr>
<th class="admin-check-col"><input id="adminSelectAll" type="checkbox"/></th>
<th>Admin</th>
<th>Display Name</th>
<th>Role</th>
<th>Status</th>
<th>Last Login</th>
<th>Created</th>
<th>Created By</th>
<th>Action</th>
</tr>
</thead>
<tbody id="adminTableBody">
<tr><td colspan="9">Loading admin accounts...</td></tr>
</tbody>
</table>
</div>
<div class="member-card-list" id="adminMobileCards"></div>
<div class="table-footer admin-table-footer">
<div class="entries-control">Show <select id="adminPageSize"><option>-</option><option>10</option><option>20</option><option>50</option><option>100</option><option>All</option></select> entries</div>
<div class="table-info" id="adminTableInfo">Showing 0 to 0 of 0 entries</div>
<div class="pagination-clean" id="adminPager"></div>
</div>
</div>
