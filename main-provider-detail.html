<div class="report-shell">
<aside class="report-sidebar" id="reportSidebar">
<div class="report-brand"><div>Backoffice</div><button class="close-side" data-close-sidebar=""><i class="bi bi-x-lg"></i></button></div>
<nav class="report-nav"></nav>
</aside>
<div class="sidebar-overlay" data-close-sidebar="" id="reportOverlay"></div>
<main class="report-main">
<header class="report-topbar">
  <button class="hamb" data-open-sidebar=""><i class="bi bi-list"></i></button>
  <div class="user-title-wrap">
    <div class="user-title-icon"><i class="bi bi-hdd-network"></i></div>
    <div>
      <h1>Providers <span class="mpv-active-badge" id="mpvActiveBadge">0 Active</span></h1>
    </div>
  </div>
  <div class="report-actions">
    <button type="button" class="bo-theme-btn" id="boThemeToggle" aria-pressed="false" title="Switch to dark mode" aria-label="Switch to dark mode">
      <i class="bi bi-sun-fill" data-theme-icon="sun"></i>
      <i class="bi bi-moon-fill" data-theme-icon="moon" hidden></i>
    </button>
    <div data-bo-profile=""></div>
  </div>
</header>

<section class="report-content mad-workspace">
  <div class="mad-chrome">
    <div class="mad-tabs" role="tablist" aria-label="Provider sections">
      <a data-bo-spa-link class="mad-tab is-active" role="tab" aria-selected="true" href="main-provider-detail.html">Providers</a>
      <a data-bo-spa-link class="mad-tab" role="tab" aria-selected="false" href="main-provider-credentials.html">Settlement</a>
      <a data-bo-spa-link class="mad-tab" role="tab" aria-selected="false" href="main-provider-health.html">Activity Logs</a>
    </div>
    <div class="mad-chrome-actions">
      <span class="mad-sync" id="mpvSyncLabel"><i class="bi bi-arrow-repeat" aria-hidden="true"></i> Synced just now</span>
      <button class="mad-btn mad-btn-ghost" type="button" id="mpvExportBtn"><i class="bi bi-upload"></i> Export</button>
      <a data-bo-spa-link class="mad-btn mad-btn-primary" href="main-provider-create.html" id="mpvAddBtn"><i class="bi bi-plus-lg"></i> Add Provider</a>
    </div>
  </div>

  <div class="mad-panel">
    <div class="mad-filter-bar">
      <div class="mad-pills" role="group" aria-label="Status filter" data-bo-seg-anim="bounce">
        <button type="button" class="mad-pill is-active" data-mpv-status="active">Active <span class="mad-pill-count is-active-count" id="mpvCountActive">0</span></button>
        <button type="button" class="mad-pill" data-mpv-status="maintenance">Maintenance <span class="mad-pill-count is-warn-count" id="mpvCountMaintenance">0</span></button>
        <button type="button" class="mad-pill" data-mpv-status="suspended">Suspended <span class="mad-pill-count is-danger-count" id="mpvCountSuspended">0</span></button>
        <button type="button" class="mad-pill" data-mpv-status="all">All <span class="mad-pill-count" id="mpvCountAll">0</span></button>
      </div>
      <div class="mad-filters">
        <label class="mad-search" for="mpvSearchInput">
          <i class="bi bi-search" aria-hidden="true"></i>
          <input id="mpvSearchInput" type="search" placeholder="Search provider name, ID or type." autocomplete="off"/>
        </label>
        <select class="mad-select" id="mpvTypeFilter">
          <option value="">All Types</option>
          <option value="direct">Direct Seamless API</option>
          <option value="aggregator">Aggregator</option>
          <option value="transfer">Transfer Wallet</option>
        </select>
        <select class="mad-select" id="mpvEnvFilter">
          <option value="">All Environments</option>
          <option value="production">Production</option>
          <option value="sandbox">Sandbox</option>
        </select>
        <button class="mad-btn mad-btn-ghost mad-reset-btn" type="button" id="mpvResetBtn"><i class="bi bi-arrow-counterclockwise"></i> Reset</button>
      </div>
    </div>

    <div class="mad-table-wrap">
      <table class="mad-table mpv-table">
        <thead>
          <tr>
            <th>Provider</th>
            <th>Currency</th>
            <th>Provider Rate</th>
            <th>Settlement</th>
            <th>Status</th>
            <th>Outstanding</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="mpvTableBody">
          <tr><td colspan="7" class="mad-empty">No providers found.</td></tr>
        </tbody>
      </table>
    </div>

    <div class="mad-footer">
      <label class="mad-page-size-control entries-control" for="mpvEntriesPageSize">Show
        <select id="mpvEntriesPageSize" class="mad-page-size-select" aria-label="Rows per page">
          <option value="-" selected>-</option>
          <option value="10">10</option>
          <option value="20">20</option>
          <option value="50">50</option>
          <option value="100">100</option>
          <option value="All">All</option>
        </select>
        <span>entries</span>
      </label>
      <div class="mad-footer-info" id="mpvTableInfo">Showing 0 to 0 of 0 providers</div>
      <div class="mad-footer-right">
        <nav class="mad-pager" id="mpvPager" aria-label="Table pagination"></nav>
      </div>
    </div>
  </div>
</section>
