  <body class="report-body standardized-listing-page page-game-provider bo-charcoal bo-account-chip">
    <div class="report-shell">
      <aside class="report-sidebar" id="reportSidebar">
          <div class="report-brand">
              <div>Backoffice</div><button class="close-side" data-close-sidebar><i
                      class="bi bi-x-lg"></i></button>
          </div>

      </aside>
      <div class="sidebar-overlay" id="reportOverlay" data-close-sidebar></div>
      <main class="report-main">
        <header class="report-topbar" data-bo-topbar data-bo-title="Game Provider Management" data-bo-icon="bi-controller"></header>
<script src="assets/js/bo-topbar.js?v=1"></script>
        <section class="report-content">
          <div class="manage-page-grid">
            <div class="manage-list-card">
              <div class="section-title slider-list-title standardized-list-toolbar"><div class="d-flex gap-2 flex-nowrap align-items-center listing-toolbar-actions"><label class="provider-list-search" for="providerSearchInput"><i class="bi bi-search" aria-hidden="true"></i><input id="providerSearchInput" type="search" placeholder="Search providers..." autocomplete="off" /></label><button class="clean-btn primary" id="syncSelectedProviderBtn" type="button"><i class="bi bi-cloud-download"></i> Sync Selected Games</button><button class="clean-btn" id="debugSelectedProviderBtn" type="button"><i class="bi bi-bug"></i> Debug Game List</button><button class="clean-btn" id="toggleApiDebugToolsBtn" type="button" aria-expanded="false" aria-haspopup="dialog" aria-controls="apiDebugToolsModal"><i class="bi bi-terminal"></i> API Debug Tools</button><a class="clean-btn primary" id="addGameProviderBtn" href="game-provider-create.html"><i class="bi bi-plus-circle"></i> Add Game Provider</a></div></div>
              <div class="slider-empty" id="providerEmpty" hidden><i class="bi bi-hdd-network"></i><b>No providers found</b><small>Create your first provider.</small></div>
              <div class="manage-list" id="providerList"></div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div class="modal-clean" id="apiDebugToolsModal" role="dialog" aria-modal="true" aria-labelledby="apiDebugToolsModalTitle" aria-hidden="true" hidden>
      <div class="modal-clean-panel wide api-debug-modal-panel">
        <div class="modal-clean-head">
          <div>
            <h3 id="apiDebugToolsModalTitle">API Debug Tools</h3>
            <small class="text-secondary">Wallet transfer, launch URL, and payload preview</small>
          </div>
          <button class="modal-clean-close" type="button" id="closeApiDebugToolsBtn" aria-label="Close"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
        </div>
        <div class="modal-clean-body">
          <form id="walletForm" class="slider-form">
            <div class="slider-two-col"><div class="field"><label>Member ID</label><input id="walletMemberId" type="number" min="1" placeholder="Example: 1" /></div><div class="field"><label>Provider</label><select id="walletProviderCode"></select></div></div>
            <div class="slider-two-col"><div class="field"><label>Transfer Amount</label><input id="walletAmount" type="number" min="0" step="0.01" placeholder="Optional. For transfer to/back or launch auto-transfer" /></div><div class="field"><label>Game Code</label><input id="walletGameCode" placeholder="For launch sport/game" /></div></div>
            <div class="slider-form-actions">
              <button class="clean-btn" type="button" data-wallet-action="main-balance">Check Main Wallet</button>
              <button class="clean-btn" type="button" data-wallet-action="create-player">Create Player Now</button>
              <button class="clean-btn" type="button" data-wallet-action="balance">Provider Balance</button>
              <button class="clean-btn primary" type="button" data-wallet-action="deposit">Manual Transfer To Provider</button>
              <button class="clean-btn danger" type="button" data-wallet-action="withdraw">Manual Transfer Back</button>
              <button class="clean-btn" type="button" data-wallet-action="launch-sport">Launch / Test URL</button>
              <select id="previewAction" class="form-select" style="width:auto;max-width:180px"><option value="CREATE_PLAYER">Create Player Preview</option><option value="BALANCE">Balance Preview</option><option value="DEPOSIT">Deposit Preview</option><option value="WITHDRAW">Withdraw Preview</option><option value="LAUNCH">Launch Preview</option><option value="GAME_LIST">Game List Preview</option><option value="PULL_LOG">Pull Log Preview</option></select>
              <button class="clean-btn" type="button" data-wallet-action="api-preview">API Payload Preview</button>
              <button class="clean-btn" type="button" data-wallet-action="pull-log-debug"><i class="bi bi-journal-text"></i> Pull Log / Bet Log</button>
            </div>
            <div class="upload-status" id="walletStatusBox"></div>
            <pre class="mt-3 p-3 bg-light rounded small" id="walletResult" style="white-space:pre-wrap;max-height:300px;overflow:auto;"></pre>
          </form>
        </div>
      </div>
    </div>
