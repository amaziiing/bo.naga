                <button class="layout-section-item" type="button" data-section="frontend-sidebar">Frontend Sidebar</button>

                <button class="layout-section-item" type="button" data-section="home-header">Home: Header / Partnership</button>

                <button class="layout-section-item" type="button" data-section="login-page">Login</button>
                <button class="layout-section-item" type="button" data-section="register-page">Register</button>
              </aside>

              <div class="layout-editor-main">
                <div class="layout-editor-current">
                  <div class="layout-editor-current-meta">
                    Editing: <strong id="currentSectionName">Right Panel</strong>
                    <small id="currentSectionKey">right-panel</small>
                  </div>

                      <i class="bi bi-search layout-find-icon" aria-hidden="true"></i>

                    </div>
                    <kbd class="layout-find-hint" aria-hidden="true">Ctrl+F</kbd>
                    <span class="layout-find-count" id="layoutFindCount" data-empty="1" aria-live="polite"></span>
                    <div class="layout-find-actions" role="group" aria-label="Find controls">
                      <button type="button" class="layout-find-nav" id="layoutFindPrev" title="Previous match (Shift+Enter)" aria-label="Previous match">
                        <svg class="layout-find-chevron" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true" focusable="false">
                          <path d="M2.2 7.6 L6 3.8 L9.8 7.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

                      </button>

                          <path d="M2.2 4.4 L6 8.2 L9.8 4.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                      </button>
                    </div>
                  </div>
                </div>

                      <div class="layout-code-input-wrap">
                        <pre class="layout-code-highlight" aria-hidden="true"><code></code></pre>
                        <textarea id="sectionHtmlEditor" spellcheck="false" placeholder="Paste HTML code here"></textarea>

                    </div>
                  </div>

                    </div>
                  </div>

                    </div>
