<!DOCTYPE html>
<html lang="en">
<head>
  <link crossorigin href="https://cdn.jsdelivr.net" rel="preconnect">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/reports.css?v=9c07f140" rel="stylesheet">
  <link href="assets/css/bo-ui-standard.css?v=817727e7" rel="stylesheet">
  <link href="assets/css/table-pagination-horizontal.css?v=e0d02694" rel="stylesheet">
  <link href="assets/css/agent-portal.css?v=f4733686" rel="stylesheet">
  <link href="assets/css/brand-agent-standard.css?v=4f68348a" rel="stylesheet">
  <link href="assets/css/bo-account-chip.css?v=c8730135" rel="stylesheet">
  <link href="assets/css/bo-charcoal-shell.css?v=6ceb4a37" rel="stylesheet">
  <link href="assets/css/bo-charcoal-legacy.css?v=8fced50e" rel="stylesheet">
  <link href="assets/css/bo-charcoal-primitives.css?v=292c8b34" rel="stylesheet">
  <link href="assets/css/bo-charcoal-agent.css?v=bc3c526b" rel="stylesheet">
  <link href="assets/css/bo-control-height.css?v=ff703846" rel="stylesheet">
  <link href="assets/css/bo-field-standard.css?v=6673ed98" rel="stylesheet">
  <link href="assets/css/bo-input-fill.css?v=1ab80f49" rel="stylesheet">
  <link href="assets/css/bo-scrollbar.css?v=39f413e5" rel="stylesheet">
  <link href="assets/css/bo-global-quicknav.css?v=0d429385" rel="stylesheet" data-bo-quicknav-css="1">
  <link href="assets/css/agent-wallet.css?v=aeb60dd6" rel="stylesheet">
  <title>Finance - Wallet</title>
</head>
<body class="report-body agent-report-body standardized-listing-page brand-agent-standard agent-modern bo-charcoal bo-account-chip" data-agent-page="finance">
  <div class="report-shell">
    <aside class="report-sidebar" id="reportSidebar">
      <div class="report-brand">
        <div>Backoffice</div>
        <button class="close-side" data-close-sidebar><i class="bi bi-x-lg"></i></button>
      </div>
      <nav class="report-nav" id="agentPortalNav"></nav>
      <div id="agentSidebarFooter"></div>
    </aside>

    <div class="sidebar-overlay" data-close-sidebar id="reportOverlay"></div>

    <main class="report-main">
      <header class="report-topbar">
        <button class="hamb" data-open-sidebar><i class="bi bi-list"></i></button>
        <div class="user-title-wrap">
          <div class="user-title-icon"><i class="bi bi-wallet2"></i></div>
          <div><h1>Finance - Wallet</h1></div>
        </div>
        <div class="report-actions">
          <button type="button" class="bo-theme-btn" id="boThemeToggle" aria-pressed="false" title="Switch to dark mode" aria-label="Switch to dark mode">
            <i class="bi bi-sun-fill" data-theme-icon="sun"></i>
            <i class="bi bi-moon-fill" data-theme-icon="moon" hidden></i>
          </button>
          <div id="agentTopProfile"></div>
        </div>
      </header>

      <section class="report-content agent-wallet-page">
        <section class="agent-withdraw-kpis agent-wallet-kpis" id="agentFinanceCards" aria-label="Wallet summary"></section>

        <div class="agent-wallet-layout">
          <section class="agent-panel agent-wallet-ledger-panel">
            <div class="agent-panel-title agent-wallet-panel-title">
              <h2><i class="bi bi-arrow-left-right"></i> Transaction History</h2>
            </div>

            <div class="agent-filter-card agent-wallet-filter-bar" aria-label="Transaction filters">
              <div class="referral-filter-grid bo-filter-row agent-standard-filter agent-wallet-filter-grid">
                <div class="field">
                  <label>From</label>
                  <input data-range-default="today" id="agentWalletFrom" type="date">
                </div>
                <div class="field">
                  <label>To</label>
                  <input id="agentWalletTo" type="date">
                </div>
                <div class="field">
                  <label>Type</label>
                  <select id="agentWalletType">
                    <option value="">All Types</option>
                    <option value="COMMISSION_EARNED">Commission</option>
                    <option value="PAYOUT">Withdraw / Payout</option>
                    <option value="ADJUSTMENT">Expense / Adjustment</option>
                    <option value="AD_REIMBURSEMENT">Advertising Reimbursement</option>
                  </select>
                </div>
                <div class="field agent-wallet-search-field">
                  <label>Search</label>
                  <div class="agent-search-box bo-search-control">
                    <i class="bi bi-search" aria-hidden="true"></i>
                    <input id="agentWalletKeyword" placeholder="Reference or remark">
                  </div>
                </div>
              </div>
            </div>

            <div class="table-wrap agent-wallet-ledger-wrap">
              <table class="report-table agent-wallet-ledger-table">
                <thead>
                  <tr>
                    <th>Time</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Before</th>
                    <th>After</th>
                    <th>Reference</th>
                    <th>Remark</th>
                  </tr>
                </thead>
                <tbody id="agentLedgerRows"></tbody>
              </table>
            </div>
            <div class="agent-table-footer agent-wallet-ledger-footer">
              <div class="agent-page-size">Show
                <select id="agentWalletPageSize" aria-label="Rows per page">
                  <option value="10">10</option>
                  <option value="20">20</option>
                  <option value="50">50</option>
                  <option value="100">100</option>
                </select> entries
              </div>
              <div id="agentWalletShowing">Showing 0 of 0 entries</div>
              <div class="agent-pagination" id="agentWalletPagination"></div>
            </div>
          </section>

          <aside class="agent-wallet-side">
            <section class="agent-panel agent-wallet-claim-panel">
              <div class="agent-panel-title agent-wallet-panel-title">
                <h2><i class="bi bi-receipt"></i> Advertising Reimbursement</h2>
              </div>

              <div class="agent-wallet-claim-note">
                <i class="bi bi-shield-check"></i>
                <div>
                  <strong>Company approval required</strong>
                  <span>Your wallet is credited only after the receipt is reviewed.</span>
                </div>
              </div>

              <form id="agentReimburseForm" class="agent-reimburse-form agent-wallet-claim-form">
                <div class="field">
                  <label for="agentReimburseAmount">Claim amount</label>
                  <div class="agent-wallet-money-input">
                    <span>RM</span>
                    <input id="agentReimburseAmount" type="number" min="0.01" step="0.01" placeholder="0.00" inputmode="decimal">
                  </div>
                </div>

                <div class="field">
                  <label for="agentReimburseProof">Receipt / proof image</label>
                  <input class="visually-hidden" id="agentReimburseProof" type="file" accept="image/png,image/jpeg,image/webp">
                  <label class="agent-wallet-upload" for="agentReimburseProof">
                    <span class="agent-wallet-upload-icon"><i class="bi bi-cloud-arrow-up"></i></span>
                    <span class="agent-wallet-upload-copy">
                      <strong>Choose receipt</strong>
                      <small id="agentReimburseFileName" aria-live="polite">PNG, JPG or WEBP</small>
                    </span>
                    <span class="agent-wallet-upload-action">Browse</span>
                  </label>
                </div>

                <div class="field">
                  <label for="agentReimburseRemark">Remark</label>
                  <textarea id="agentReimburseRemark" rows="3" maxlength="200" placeholder="What was this advertising expense for?"></textarea>
                </div>

                <button type="button" class="btn-primary-clean" id="agentReimburseSubmit">
                  <i class="bi bi-send"></i> Submit reimbursement claim
                </button>
              </form>
            </section>

            <section class="agent-panel agent-wallet-deductions-panel">
              <div class="agent-panel-title agent-wallet-panel-title">
                <h2><i class="bi bi-receipt-cutoff"></i> Company-Paid Deductions</h2>
                <span class="agent-wallet-count" id="agentExpenseCount">0</span>
              </div>
              <div class="agent-wallet-deductions-list" id="agentExpenseRows"></div>
            </section>
          </aside>
        </div>

        <div class="quick-stats d-none" id="agentWalletMetrics"></div>
      </section>
    </main>
  </div>

  <script src="assets/js/config.js?v=e7312672"></script>
  <script src="assets/js/main-currency-runtime.js?v=2b28e860"></script>
  <script src="assets/js/reports.js?v=a96450f8"></script>
  <script src="assets/js/bo-date-range.js?v=b1113dc8"></script>
  <script src="assets/js/agent-portal.js?v=ec3041ad"></script>
  <script src="assets/js/pagination-standardizer.js?v=9eb44c56"></script>
  <script defer src="assets/js/bo-ui-standard.js?v=890f213b"></script>
  <script src="assets/js/currency-runtime.js?v=b63c89fb"></script>
  <script src="assets/js/bo-theme.js?v=d78603d9"></script>
  <script src="assets/js/bo-account-chip.js?v=fcf6fa08"></script>
</body>
</html>
