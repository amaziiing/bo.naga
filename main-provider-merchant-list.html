<body class="report-body standardized-listing-page main-admin-detail-page main-report-exec-page main-win-lose-page main-provider-merchant-page bo-account-chip" data-access-page="main_provider_report" data-report-view="provider-merchants">
<div class="report-shell">
<aside class="report-sidebar" id="reportSidebar">
<div class="report-brand"><div>Backoffice</div><button class="close-side" data-close-sidebar><i class="bi bi-x-lg"></i></button></div>
<nav class="report-nav"></nav>
</aside>
<div class="sidebar-overlay" data-close-sidebar></div>
<main class="report-main">
<header class="report-topbar">
  <button class="hamb" data-open-sidebar><i class="bi bi-list"></i></button>
  <div class="user-title-wrap">
    <div class="user-title-icon"><i class="bi bi-people"></i></div>
    <div>
      <h1>Merchant List</h1>
    </div>
  </div>
  <div class="report-actions">
    <button type="button" class="bo-theme-btn" id="boThemeToggle" aria-pressed="false" title="Switch to dark mode" aria-label="Switch to dark mode">
      <i class="bi bi-sun-fill" data-theme-icon="sun"></i>
      <i class="bi bi-moon-fill" data-theme-icon="moon" hidden></i>
    </button>
    <div data-bo-profile></div>
  </div>
</header>

<section class="report-content mad-workspace mre-workspace">
  <!-- One provider's merchants: the other half of the Provider Report. The eye on that report's
       provider rows opens this page; `Back to list` returns to the report with its range, so the
       two pages read as one workspace (see main-provider-merchant-list.js).

       Every number here is scoped to the provider: the rows come from the same
       `/admin/main/reports/provider-settlement` call the report makes, filtered to this
       `providerCode` and grouped by merchant. The brand-level columns of the report's own
       Merchant panel (Bonus / Net Profit / Active Players) are deliberately absent - they come
       from another endpoint and are only per merchant, so they would not be this provider's
       share of them. -->
  <div class="pml-head">
    <div class="pml-identity">
      <span class="mmr-mark" id="pmlMark" aria-hidden="true">--</span>
      <div class="mmr-merchant-copy">
        <b id="pmlName">Loading provider…</b>
        <small id="pmlMeta">—</small>
      </div>
    </div>
    <div class="pml-meta">
      <!-- The range is editable here too (owner: "这个页面也要啊 日期选项"). Same field and component as the
           report list, and the same URL contract: a range set here is the range the report comes back to. -->
      <div class="field ref-date-field mre-date-field main-mod-date main-exec-date-field pml-date-field">
        <input type="hidden" id="pmlFrom"/>
        <input type="hidden" id="pmlTo"/>
        <div class="ref-range-wrap">
          <button class="ref-range-trigger mre-date-trigger" id="pmlDateTrigger" type="button" aria-label="Select date range" aria-expanded="false">
            <span class="ref-range-icon"><i class="bi bi-calendar3"></i></span>
            <span id="pmlDateLabel">Select date range</span>
            <i class="bi bi-chevron-down ms-auto"></i>
          </button>
          <div class="ref-range-picker" id="pmlRangePicker">
            <div class="ref-range-presets">
              <button data-pml-preset="today" type="button">Today</button>
              <button data-pml-preset="yesterday" type="button">Yesterday</button>
              <button data-pml-preset="thisWeek" type="button">This Week</button>
              <button data-pml-preset="lastWeek" type="button">Last Week</button>
              <button data-pml-preset="thisMonth" type="button">This Month</button>
              <button data-pml-preset="lastMonth" type="button">Last Month</button>
              <button data-pml-preset="thisYear" type="button">This Year</button>
              <button data-pml-preset="lastYear" type="button">Last Year</button>
            </div>
            <div class="ref-range-calendar">
              <div class="ref-cal-head">
                <button id="pmlCalPrev" type="button"><i class="bi bi-chevron-left"></i></button>
                <button class="ref-head-pick" id="pmlCalMonth" type="button"></button>
                <button class="ref-head-pick" id="pmlCalYear" type="button"></button>
                <button id="pmlCalNext" type="button"><i class="bi bi-chevron-right"></i></button>
              </div>
              <div class="ref-cal-month-grid" id="pmlCalMonthGrid"></div>
              <div class="ref-cal-year-grid" id="pmlCalYearGrid"></div>
              <div class="ref-cal-day-view" id="pmlCalDayView">
                <div class="ref-cal-week"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
                <div class="ref-cal-days" id="pmlCalDays"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <span class="pml-currency mre-cur-label" id="pmlCurrency">(MYR)</span>
    </div>
    <a class="mad-btn mad-btn-ghost pml-back" id="pmlBack" href="main_provider_report.html"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back to list</a>
  </div>

  <div class="mre-history-kpis pml-kpis" id="pmlSummary" aria-label="Provider totals"></div>

  <div class="mad-panel mre-panel" data-report-panel="provider-merchants">
    <div class="wl-breakdown">
      <div class="wl-breakdown-head">
        <div class="wl-breakdown-title">
          <span class="wl-breakdown-icon" aria-hidden="true"><i class="bi bi-people"></i></span>
          <div>
            <h6>Merchants</h6>
            <small id="pmlHint">Turnover &amp; settlement</small>
          </div>
        </div>
        <div class="wl-breakdown-actions">
          <span class="wl-consumed"><em>Turnover</em><b id="pmlTurnover">0.00</b></span>
          <button type="button" class="wl-excel-btn" id="pmlCopy" title="Copy report to clipboard">
            <i class="bi bi-clipboard" aria-hidden="true"></i> Copy report
          </button>
          <button type="button" class="wl-excel-btn is-ghost" id="pmlCsv" title="Download CSV">
            <i class="bi bi-download" aria-hidden="true"></i> CSV
          </button>
        </div>
      </div>
      <div class="wl-breakdown-scroll">
        <table class="wl-subtable pml-table" id="pmlTable">
          <colgroup>
            <col class="wl-col-prov"/>
            <col/><col/><col/><col/><col/>
            <col class="pml-col-bets"/>
            <col class="pml-col-action"/>
          </colgroup>
          <thead>
            <tr>
              <th>Merchant</th>
              <th class="mre-num">Turnover</th>
              <th class="mre-num">Gross Amount</th>
              <th class="mre-num">Merchant Receivable</th>
              <th class="mre-num">Pay to Provider</th>
              <th class="mre-num">Company Margin</th>
              <th class="mre-num">Bets</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="pmlRows">
            <tr><td colspan="8" class="mad-empty">Loading merchants…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</section>
</main>
