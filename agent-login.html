<head>

    <link href="assets/css/reports.css?v=57e9b850" rel="stylesheet">

<body class="report-body bo-login-body bo-charcoal bo-account-chip">
    <main class="auth-page">
        <section class="auth-card">
            <header class="auth-heading">
                <div class="auth-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <circle cx="12" cy="8" r="4" />
                        <path d="M4 21a8 8 0 0 1 16 0" />
                    </svg></div>
                <h1>Agent Portal</h1>
                <p class="auth-subtitle">Sign in with the portal credentials configured in Agent Management.</p>
            </header>
            <form id="agentLoginForm">
                <div class="auth-field"><label for="agentLoginUser">Username</label>
                    <div class="auth-input-wrap"><svg class="auth-input-icon" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.8">
                            <circle cx="12" cy="7" r="4" />
                            <path d="M4 21a8 8 0 0 1 16 0" />
                        </svg><input class="form-control" id="agentLoginUser" type="text"
                            placeholder="Enter agent username" autocomplete="username" required></div>
                </div>
                <div class="auth-field"><label for="agentLoginPass">Password</label>
                    <div class="auth-input-wrap"><svg class="auth-input-icon" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.8">
                            <rect x="4" y="10" width="16" height="11" rx="3" />
                            <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                        </svg><input class="form-control" id="agentLoginPass" type="password"
                            placeholder="Enter password" autocomplete="current-password" required></div>
                </div>
                <div class="upload-status" id="agentLoginMsg"></div><button class="btn auth-submit w-100"
                    type="submit"><span>Sign in to Agent Portal</span><svg viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14" />
                        <path d="m13 6 6 6-6 6" />
                    </svg></button>
            </form>
            <footer class="auth-footer">Authorized agent access only</footer>
        </section>
    </main>
    <script src="assets/js/config.js?v=e7312672"></script>
<script src="assets/js/main-currency-runtime.js?v=7a2c0062"></script>
    <script src="assets/js/agent-portal.js?v=e8055dbb"></script>
<script src="assets/js/currency-runtime.js?v=b63c89fb"></script>
<script src="assets/js/bo-theme.js?v=d78603d9"></script>
<script src="assets/js/bo-account-chip.js?v=94cb2c63"></script>
</body>

</html>
