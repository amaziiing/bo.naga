<body class="report-body standardized-listing-page main-admin-detail-page main-admin-create-page main-provider-create-page bo-charcoal bo-account-chip" data-access-page="main_provider_detail">
<div class="report-shell">
<aside class="report-sidebar" id="reportSidebar">
<div class="report-brand"><div>Backoffice</div><button class="close-side" data-close-sidebar=""><i class="bi bi-x-lg"></i></button></div>
<nav class="report-nav"></nav>
</aside>
<div class="sidebar-overlay" data-close-sidebar="" id="reportOverlay"></div>
<main class="report-main">
<header class="report-topbar">
  <button class="hamb" data-open-sidebar=""><i class="bi bi-list"></i></button>
  <div class="user-title-wrap">
    <div class="user-title-icon"><i class="bi bi-hdd-network"></i></div>
    <div>
      <h1>Add Provider</h1>
    </div>
  </div>
  <div class="report-actions">
    <button type="button" class="bo-theme-btn" id="boThemeToggle" aria-pressed="false" title="Switch to dark mode" aria-label="Switch to dark mode">
      <i class="bi bi-sun-fill" data-theme-icon="sun"></i>
      <i class="bi bi-moon-fill" data-theme-icon="moon" hidden></i>
    </button>
    <div data-bo-profile=""></div>
  </div>
</header>

<section class="report-content mac-workspace">
  <form id="mpvCreateForm" class="mac-form" novalidate>
    <section class="mac-section">
      <header class="mac-section-head mac-section-head-rich">
        <span class="mac-section-icon" aria-hidden="true"><i class="bi bi-building"></i></span>
        <div class="mac-section-copy">
          <h3>1. Provider Details</h3>
          <p>Code, name, category, rate, currency, and optional remark.</p>
        </div>
        <a data-bo-spa-link class="mad-btn mad-btn-ghost mac-back-section" href="main-provider-detail.html"><i class="bi bi-arrow-left"></i> Back to List</a>
      </header>
      <div class="mac-fields-stack">
        <div class="mac-fields mac-fields-row mac-fields-row-2">
          <label class="mac-field" for="mpvProviderCode">
            <span class="mac-label">Provider Code <b>*</b></span>
            <input class="form-control" id="mpvProviderCode" name="providerCode" required autocomplete="off" placeholder="e.g. PGSOFT" maxlength="32"/>
          </label>
          <label class="mac-field" for="mpvProviderName">
            <span class="mac-label">Provider Name <b>*</b></span>
            <input class="form-control" id="mpvProviderName" name="providerName" required autocomplete="organization" placeholder="e.g. PG Soft"/>
          </label>
        </div>
        <div class="mac-fields mac-fields-row mac-fields-row-3">
          <label class="mac-field" for="mpvGameCategory">
            <span class="mac-label">Game Category <b>*</b></span>
            <select class="form-control mad-select" id="mpvGameCategory" name="gameCategory" required>
              <option value="" disabled selected>Select category</option>
              <option value="SLOT">Slot</option>
              <option value="LIVE">Live</option>
              <option value="SPORTS">Sports</option>
              <option value="FISH">Fishing</option>
              <option value="LOTTERY">Lottery</option>
              <option value="ESPORTS">E-Sports</option>
            </select>
          </label>
          <label class="mac-field" for="mpvCurrency">
            <span class="mac-label">Currency <b>*</b></span>
            <select class="form-control mad-select" id="mpvCurrency" name="currency" required>
              <option value="MYR" selected>MYR</option>
              <option value="USD">USD</option>
              <option value="SGD">SGD</option>
              <option value="THB">THB</option>
              <option value="VND">VND</option>
              <option value="IDR">IDR</option>
            </select>
          </label>
          <label class="mac-field" for="mpvPercent">
            <span class="mac-label">Percent <b>*</b></span>
            <span class="mac-input-group is-suffix">
              <input class="form-control" id="mpvPercent" name="percent" type="number" required min="0" max="100" step="0.01" placeholder="15.00" inputmode="decimal"/>
              <span class="mac-input-addon is-trailing" aria-hidden="true">%</span>
            </span>
          </label>
        </div>
        <label class="mac-field" for="mpvRemark">
          <span class="mac-label">Remark <span class="mac-label-optional">(Optional)</span></span>
          <textarea class="form-control" id="mpvRemark" name="remark" rows="4" maxlength="500" placeholder="e.g. Monthly settlement, invoice on 5th��"></textarea>
          <small class="mpv-create-count"><span id="mpvRemarkCount">0</span>/500</small>
        </label>
      </div>
    </section>

    <div class="upload-status mb-0" id="mpvCreateStatus"></div>

    <footer class="mac-footer-actions">
      <a data-bo-spa-link class="mad-btn mad-btn-ghost" href="main-provider-detail.html">Cancel</a>
      <button class="mad-btn mad-btn-navy" type="submit" id="mpvCreateSubmit"><i class="bi bi-check2"></i> Create Provider</button>
    </footer>
  </form>
</section>
</main>
