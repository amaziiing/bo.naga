  user: function () { return { id: 1, username: "h", roleType: "MAIN", rootAdmin: true, menus: [] }; },

  refreshMe: function () { return Promise.resolve(null); },
  injectProfile: function () {}, bindDynamicSidebarEvents: function () {}, renderSidebar: function () {},

  loadMenuGroups: function () { return Promise.resolve(); }
};
(function () {
  var real = window.fetch.bind(window);
  var rows = [];
  for (var i = 1; i <= 14; i++) rows.push({ member_id: i, memberId: i, username: "0111234" + (5670 + i), vip_tier: 0, vipTier: 0,
    total_bet: 100 + i, totalBet: 100 + i, valid_bet: 98 + i, validBet: 98 + i, win_lose: -20 * i, winLose: -20 * i });
  function ok(d) { return Promise.resolve(new Response(JSON.stringify({ status: "ok", data: d }), { status: 200, headers: { "Content-Type": "application/json" } })); }
  window.fetch = function (input, init) {
    var url = ""; try { url = typeof input === "string" ? input : (input && input.url) || ""; } catch (e) {}
    if (!url) return real(input, init);
    var size = 20, page = 0;
    try { var u = new URL(url, location.href); size = Number(u.searchParams.get("size")) || 20; page = Number(u.searchParams.get("page")) || 0; } catch (e) {}
    var slice = rows.slice(page * size, page * size + size);
    return ok({ content: slice, rows: slice, totalElements: 14, totalPages: 1, size: size,
      pagination: { totalElements: 14, totalPages: 1, page: page, size: size }, summary: {}, brand: {} });
  };
})();
