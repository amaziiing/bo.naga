<!doctype html>
<html lang="en">
  <head>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Duplicate IP Checker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <script>
      (function(){try{if(localStorage.getItem('bo_theme')==='dark')document.documentElement.setAttribute('data-bo-theme','dark');}catch(e){}})();
    </script>
    <link href="assets/css/reports.css?v=66abea56" rel="stylesheet" />
    <link href="assets/css/bo-ui-standard.css?v=a796b0f3" rel="stylesheet" />
    <link href="assets/css/bo-targeted-fixes.css?v=7a2ebdcc" rel="stylesheet" />
    <link href="assets/css/bo-account-chip.css?v=e6d15d38" rel="stylesheet" />
    <link href="assets/css/bo-charcoal-shell.css?v=94a85378" rel="stylesheet" />
    <link href="assets/css/bo-charcoal-legacy.css?v=1d61f146" rel="stylesheet" />
    <link href="assets/css/bo-charcoal-primitives.css?v=08ac715e" rel="stylesheet" />
    <link href="assets/css/bo-charcoal-cms.css?v=8a7fd178" rel="stylesheet" />
    <link href="assets/css/bo-input-fill.css?v=1969f85a" rel="stylesheet" />
    <link href="assets/css/duplicate-ip.css?v=b8434d41" rel="stylesheet" />
<link href="assets/css/bo-scrollbar.css?v=7c2a456b" rel="stylesheet"/>
  </head>
  <body class="report-body bo-charcoal bo-account-chip duplicate-ip-page">
    <div class="report-shell">
      <aside class="report-sidebar" id="reportSidebar">
        <div class="report-brand">
          <div>Backoffice</div>
          <button class="close-side" data-close-sidebar type="button" aria-label="Close menu">
            <i class="bi bi-x-lg"></i>
          </button>
        </div>
        <nav class="report-nav"></nav>
      </aside>
      <div class="sidebar-overlay" data-close-sidebar id="reportOverlay"></div>
      <main class="report-main">
        <header class="report-topbar">
          <button class="hamb" data-open-sidebar type="button" aria-label="Open menu">
            <i class="bi bi-list"></i>
          </button>
          <div class="user-title-wrap">
            <div class="user-title-icon"><i class="bi bi-diagram-3"></i></div>
            <div><h1>Duplicate IP Checker</h1></div>
          </div>
          <div class="report-actions">
            <button type="button" class="bo-theme-btn" id="boThemeToggle" aria-pressed="false" title="Switch to dark mode" aria-label="Switch to dark mode">
              <i class="bi bi-sun-fill" data-theme-icon="sun"></i>
              <i class="bi bi-moon-fill" data-theme-icon="moon" hidden></i>
            </button>
            <div data-bo-profile></div>
          </div>
        </header>

        <section class="report-content">
          <div class="dup-panel">
            <div class="dup-filter-card">
              <label aria-label="Search IP">
                <div class="dup-search-control">
                  <i class="bi bi-search" aria-hidden="true"></i>
                  <input id="dupIpSearch" type="search" placeholder="Search IP..." autocomplete="off" spellcheck="false" />
                </div>
              </label>
              <div class="dup-filter-spacer" aria-hidden="true"></div>
              <div class="dup-toolbar-actions">
                <button class="clean-btn" id="dupReset" type="button">
                  <i class="bi bi-arrow-clockwise" aria-hidden="true"></i> Reset
                </button>
                <button class="clean-btn" id="dupRefresh" type="button">
                  <i class="bi bi-arrow-clockwise" aria-hidden="true"></i> Refresh
                </button>
                <button class="btn-primary-clean" id="dupSearch" type="button">
                  <i class="bi bi-search" aria-hidden="true"></i> Search
                </button>
              </div>
            </div>

            <div class="dup-table-wrap">
              <table class="report-table">
                <colgroup>
                  <col class="dup-col-idx" />
                  <col class="dup-col-ip" />
                  <col class="dup-col-share" />
                  <col class="dup-col-action" />
                </colgroup>
                <thead>
                  <tr>
                    <th>#</th>
                    <th>IP Address</th>
                    <th>Users Sharing</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="dupBody">
                  <tr><td colspan="4">Loading...</td></tr>
                </tbody>
              </table>
            </div>

            <div class="dup-footer table-footer standard-pagination mad-footer bo-pagination-standard">
              <div class="entries-control">Show
                <select id="dupPageSize" aria-label="Show entries">
                  <option value="-" selected>-</option>
                  <option value="10">10</option>
                  <option value="20">20</option>
                  <option value="50">50</option>
                  <option value="100">100</option>
                  <option value="All">All</option>
                </select>
                entries
              </div>
              <div class="table-info mad-footer-info" id="dupCount">Showing 0 to 0 of 0 entries</div>
              <nav aria-label="Duplicate IP pagination" class="pagination-clean bo-pagination-buttons mad-pager" id="dupPagination" role="navigation"></nav>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div
      hidden
      aria-hidden="true"
      class="modal-clean"
      id="dupUsersModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="dupUsersTitle"
    >
      <div class="modal-clean-panel dup-users-modal-panel">
        <div class="modal-clean-head">
          <div>
            <h3 id="dupUsersTitle">Users sharing</h3>
            <p>Members that share this registration or last-login IP.</p>
          </div>
          <button class="modal-clean-close" type="button" data-dup-users-close aria-label="Close">
            <i class="bi bi-x-lg" aria-hidden="true"></i>
          </button>
        </div>
        <div class="modal-clean-body dup-users-modal-body">
          <div class="dup-table-wrap dup-users-modal-table">
            <table class="report-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Username</th>
                  <th>Name</th>
                  <th>Mobile</th>
                  <th>Registration IP</th>
                  <th>Last Login IP</th>
                  <th>Last Login</th>
                  <th>Register Date</th>
                </tr>
              </thead>
              <tbody id="dupUsersBody"></tbody>
            </table>
          </div>
        </div>
        <div class="modal-clean-foot">
          <button class="clean-btn" type="button" data-dup-users-close>Close</button>
        </div>
      </div>
    </div>

    <script src="assets/js/config.js?v=8732ba44"></script>
    <script src="assets/js/brand-context.js?v=3bb07655"></script>
    <script src="assets/js/main-currency-runtime.js?v=bc97a89c"></script>
    <script src="assets/js/currency-runtime.js?v=71496e4c"></script>
    <script src="assets/js/reports.js?v=063b42e4"></script>
    <script src="assets/js/auth.js?v=1.0.50"></script>
    <script src="assets/js/duplicate-ip.js?v=3558e6cd"></script>
    <script src="assets/js/pagination-standardizer.js?v=3949027a"></script>
    <script src="assets/js/operation-global-notification.js?v=3e3a4090"></script>
    <script src="assets/js/bo-ui-standard.js?v=e18e682d"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="assets/js/firebase-config.js?v=01bf393d"></script>
    <script src="assets/js/livechat-global-notification.js?v=402f6f19"></script>
    <script src="assets/js/bo-theme.js?v=b1e789f3"></script>
    <script src="assets/js/bo-account-chip.js?v=8b9ce6d4"></script>
  </body>
</html>
