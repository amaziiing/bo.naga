<body class="report-body standardized-listing-page bo-charcoal bo-account-chip bo-access-control" data-access-page="role" data-role-edit-page="role-create.html">
<div class="report-shell">
<aside class="report-sidebar" id="reportSidebar">
<div class="report-brand"><div>Backoffice</div><button class="close-side" data-close-sidebar=""><i class="bi bi-x-lg"></i></button></div>
<nav class="report-nav"></nav>
</aside>
<div class="sidebar-overlay" data-close-sidebar="" id="reportOverlay"></div>
<main class="report-main">
<header class="report-topbar" data-bo-topbar data-bo-title="Role Management" data-bo-icon="bi-person-badge" data-bo-title-block-class="user-title-block"><span data-bo-topbar-title-extra class="users-found-badge" id="roleCountBadge">0 Groups</span></header>
<script src="assets/js/bo-topbar.js?v=1"></script>
<section class="report-content role-listing-page">
<div class="table-card role-listing-card" data-ac-listing data-ac-pagesize="-">
<div class="user-toolbar">
<div class="mad-pills ac-status-pills" role="group" aria-label="Status filter" data-bo-seg-anim="bounce" data-ac-status-pills>
<button type="button" class="mad-pill is-active" data-mad-status="active" aria-pressed="true">Active <span class="mad-pill-count is-active-count" data-ac-status-count="active">0</span></button>
<button type="button" class="mad-pill" data-mad-status="suspended" aria-pressed="false">Inactive <span class="mad-pill-count is-danger-count" data-ac-status-count="suspended">0</span></button>
<button type="button" class="mad-pill" data-mad-status="all" aria-pressed="false">All <span class="mad-pill-count" data-ac-status-count="all">0</span></button>
</div>
<div class="user-search-grid bo-filter-row">
<div class="field">
<label class="bo-search-control"><i class="bi bi-search" aria-hidden="true"></i><input id="roleSearch" data-ac-search aria-label="Search group name or code" placeholder="Search group name or code"/></label>
</div>
</div>
<div class="user-toolbar-actions">
<a class="clean-btn primary role-add-btn" href="role-create.html"><i class="bi bi-plus-lg"></i> Add Group</a>
</div>
</div>
<div class="table-wrap">
<table class="report-table table-clean role-main-table">
<thead><tr><th>Group Name</th><th>Group Code</th><th>Permissions</th><th>Status</th><th>Action</th></tr></thead>
<tbody id="accessTableBody"><tr><td colspan="5">Loading groups...</td></tr></tbody>
</table>
</div>
<div class="member-card-list" id="roleMobileCards"></div>
</div>
</section>
</main>
</div>
