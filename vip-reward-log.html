  try{

  }catch(e){}

<body class="report-body vip-log-page vip-reward-log-page bo-charcoal bo-account-chip">
<div class="report-shell">
<aside class="report-sidebar" id="reportSidebar">
<div class="report-brand">
<div>Backoffice</div><button class="close-side" data-close-sidebar=""><i class="bi bi-x-lg"></i></button>
</div>
<nav class="report-nav"></nav>
</aside>
<div class="sidebar-overlay" data-close-sidebar="" id="reportOverlay"></div>
<main class="report-main">
<header class="report-topbar" data-bo-topbar data-bo-title="VIP Reward Log" data-bo-icon="bi-cash-stack"></header>
<script src="assets/js/bo-topbar.js?v=1"></script>
<section class="report-content">
<div class="vip-log-card">
<div class="vip-log-toolbar">
<nav class="bo-tx-tabs bo-seg" id="rewardStatusTabs" aria-label="Reward status" data-bo-seg-anim="bounce">
<button type="button" class="bo-tx-tab is-active" data-reward-status="AVAILABLE" aria-pressed="true">Available</button>
<button type="button" class="bo-tx-tab" data-reward-status="PAID" aria-pressed="false">Paid</button>
<button type="button" class="bo-tx-tab" data-reward-status="SKIPPED" aria-pressed="false">Skipped</button>
<button type="button" class="bo-tx-tab" data-reward-status="" aria-pressed="false">All</button>
</nav>
<div class="vip-log-filters bo-filter-row">
<label class="bo-search-control"><i class="bi bi-search" aria-hidden="true"></i><input id="rewardKeyword" type="search" autocomplete="off" aria-label="Search reward logs" placeholder="Username, mobile, ref"/></label>
<select id="rewardType" data-bo-auto-width="0" aria-label="Reward type">
<option value="">All Types</option>
<option>DAILY_REBATE</option>
<option>WEEKLY_BONUS</option>
<option>MONTHLY_BONUS</option>
<option>UPGRADE_BONUS</option>
<option>STEP_BONUS</option>
<option>BIRTHDAY_BONUS</option>
</select>
</div>
</div>
<div class="vip-admin-table-wrap">
<div class="vip-tx-table-head">
<table class="vip-admin-table vip-admin-table-head">
<colgroup>
<col class="vip-c-date"/><col class="vip-c-member"/><col class="vip-c-type"/><col class="vip-c-period"/><col class="vip-c-base"/><col class="vip-c-rate"/><col class="vip-c-reward"/><col class="vip-c-maint"/><col class="vip-c-status"/><col class="vip-c-ref"/>
</colgroup>
<thead>
<tr>
<th>Date</th>
<th>Member</th>
<th>Type</th>
<th class="vip-col-period">Period</th>
<th class="vip-col-base">Base</th>
<th class="vip-col-rate">Rate</th>
<th>Reward</th>
<th class="vip-col-maint">Maintenance</th>
<th>Status</th>
<th class="vip-col-reference">Reference / Remark</th>
</tr>
</thead>
</table>
</div>
<div class="vip-tx-table-body" id="rewardTableScroll">
<table class="vip-admin-table vip-admin-table-body">
<colgroup>
<col class="vip-c-date"/><col class="vip-c-member"/><col class="vip-c-type"/><col class="vip-c-period"/><col class="vip-c-base"/><col class="vip-c-rate"/><col class="vip-c-reward"/><col class="vip-c-maint"/><col class="vip-c-status"/><col class="vip-c-ref"/>
</colgroup>
<tbody id="rewardBody">
<tr>
<td class="vip-log-empty" colspan="10">Loading…</td>
</tr>
</tbody>
</table>
</div>
</div>
<div class="table-footer">
<div class="entries-control">Show <select id="rewardPageSize" data-bo-auto-width="0" aria-label="Rows per page">
<option selected value="-">-</option>
<option value="10">10</option>
<option value="20">20</option>
<option value="50">50</option>
<option value="100">100</option>
<option value="All">All</option>
</select> entries</div>
<div class="table-info" id="rewardPageInfo">Showing 0 to 0 of 0 entries</div>
<div class="pagination-clean" id="rewardPagination"></div>
</div>
</div>
</section>
</main>
</div>
