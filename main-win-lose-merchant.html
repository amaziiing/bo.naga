<body class="report-body standardized-listing-page main-admin-detail-page main-report-exec-page main-win-lose-page main-win-lose-merchant-page bo-account-chip" data-access-page="main_report" data-report-view="winlose-merchant">
<div class="report-shell">
<aside class="report-sidebar" id="reportSidebar">
<div class="report-brand"><div>Backoffice</div><button class="close-side" data-close-sidebar><i class="bi bi-x-lg"></i></button></div>
<nav class="report-nav"></nav>
</aside>
<div class="sidebar-overlay" data-close-sidebar></div>
<main class="report-main">
<header class="report-topbar">
  <button class="hamb" data-open-sidebar><i class="bi bi-list"></i></button>
  <div class="user-title-wrap">
    <div class="user-title-icon"><i class="bi bi-graph-up-arrow"></i></div>
    <div>
      <h1>Provider Consumption</h1>
    </div>
  </div>
  <div class="report-actions">
    <button type="button" class="bo-theme-btn" id="boThemeToggle" aria-pressed="false" title="Switch to dark mode" aria-label="Switch to dark mode">
      <i class="bi bi-sun-fill" data-theme-icon="sun"></i>
      <i class="bi bi-moon-fill" data-theme-icon="moon" hidden></i>
    </button>
    <div data-bo-profile></div>
  </div>
</header>

<section class="report-content mad-workspace mre-workspace">
  <!-- One merchant's half of the Win/Lose report. The eye on the list opens this page; the
       `Back to list` link returns to the list with the range and filters it was opened with,
       so the two pages read as one workspace (see main-win-lose-merchant.js). -->
  <div class="wlm-head">
    <div class="wlm-identity">
      <span class="mmr-mark" id="wlmMark" aria-hidden="true">--</span>
      <div class="mmr-merchant-copy">
        <b id="wlmName">Loading merchant…</b>
        <small id="wlmTier">—</small>
      </div>
    </div>
    <div class="wlm-meta">
      <!-- The range is editable here, not only on the list (owner: "Merchant report小眼睛>Provider
           Consumption 页面不能改date Range要退回母级页面才能修改日期"). Same field, same component and
           the same URL contract as the parent list, so a range set here is the range the list
           comes back to. -->
      <div class="field ref-date-field mre-date-field main-mod-date main-exec-date-field wlm-date-field">
        <input type="hidden" id="wlmFrom"/>
        <input type="hidden" id="wlmTo"/>
        <div class="ref-range-wrap">
          <button class="ref-range-trigger mre-date-trigger" id="wlmDateTrigger" type="button" aria-label="Select date range" aria-expanded="false">
            <span class="ref-range-icon"><i class="bi bi-calendar3"></i></span>
            <span id="wlmDateLabel">Select date range</span>
            <i class="bi bi-chevron-down ms-auto"></i>
          </button>
          <div class="ref-range-picker" id="wlmRangePicker">
            <div class="ref-range-presets">
              <button data-wlm-preset="today" type="button">Today</button>
              <button data-wlm-preset="yesterday" type="button">Yesterday</button>
              <button data-wlm-preset="thisWeek" type="button">This Week</button>
              <button data-wlm-preset="lastWeek" type="button">Last Week</button>
              <button data-wlm-preset="thisMonth" type="button">This Month</button>
              <button data-wlm-preset="lastMonth" type="button">Last Month</button>
              <button data-wlm-preset="thisYear" type="button">This Year</button>
              <button data-wlm-preset="lastYear" type="button">Last Year</button>
            </div>
            <div class="ref-range-calendar">
              <div class="ref-cal-head">
                <button id="wlmCalPrev" type="button"><i class="bi bi-chevron-left"></i></button>
                <button class="ref-head-pick" id="wlmCalMonth" type="button"></button>
                <button class="ref-head-pick" id="wlmCalYear" type="button"></button>
                <button id="wlmCalNext" type="button"><i class="bi bi-chevron-right"></i></button>
              </div>
              <div class="ref-cal-month-grid" id="wlmCalMonthGrid"></div>
              <div class="ref-cal-year-grid" id="wlmCalYearGrid"></div>
              <div class="ref-cal-day-view" id="wlmCalDayView">
                <div class="ref-cal-week"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
                <div class="ref-cal-days" id="wlmCalDays"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <span class="mad-status is-active" id="wlmStatus"><i aria-hidden="true"></i><span id="wlmStatusText">—</span></span>
      <span class="wlm-currency mre-cur-label" id="wlmCurrency">(MYR)</span>
    </div>
    <a class="mad-btn mad-btn-ghost wlm-back" id="wlmBack" href="main-win-lose-report.html"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back to list</a>
  </div>

  <div class="mre-history-kpis wlm-kpis" id="wlmSummary" aria-label="Merchant totals"></div>

  <div class="mad-panel mre-panel" data-report-panel="winlose-merchant">
    <div class="wl-breakdown">
      <div class="wl-breakdown-head">
        <div class="wl-breakdown-title">
          <span class="wl-breakdown-icon" aria-hidden="true"><i class="bi bi-diagram-3"></i></span>
          <div>
            <h6>Provider Consumption</h6>
            <small id="wlmHint">Turnover &amp; 消耗分数</small>
          </div>
        </div>
        <div class="wl-breakdown-actions">
          <span class="wl-consumed"><em>Total Consumed</em><b id="wlmConsumed">0.00</b><span>pts</span></span>
          <button type="button" class="wl-excel-btn" id="wlmCopy" title="Copy report to clipboard">
            <i class="bi bi-clipboard" aria-hidden="true"></i> Copy report
          </button>
          <button type="button" class="wl-excel-btn is-ghost" id="wlmCsv" title="Download CSV">
            <i class="bi bi-download" aria-hidden="true"></i> CSV
          </button>
        </div>
      </div>
      <div class="wl-breakdown-scroll">
        <table class="wl-subtable" id="wlmTable">
          <colgroup>
            <col class="wl-col-prov"/>
            <col/><col/><col/><col/><col/>
            <col class="wl-col-share"/>
            <col class="wlm-col-action"/>
          </colgroup>
          <thead>
            <tr>
              <th>Provider</th>
              <th class="mre-num">Total Bet</th>
              <th class="mre-num">Valid Bet</th>
              <th class="mre-num">Total In</th>
              <th class="mre-num">Total Out</th>
              <th class="mre-num">Win/Lose</th>
              <th class="mre-num">Share</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="wlmRows">
            <tr><td colspan="8" class="mad-empty">Loading providers…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</section>
</main>
