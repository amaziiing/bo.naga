  <form id="mrcForm" class="mrc-form" novalidate>
    <section class="mrc-card">
      <header class="mrc-card-head">
        <div class="mrc-card-head-main">
          <span class="mrc-card-icon" aria-hidden="true"><i class="bi bi-person-gear"></i></span>

        </div>
        <a data-bo-spa-link class="mrc-btn mrc-btn-ghost mrc-back-list" href="menu-permission.html">
          <i class="bi bi-arrow-left" aria-hidden="true"></i> Back to list

      </header>
      <label class="mrc-field" for="mrcRoleName">
        <span class="mrc-label">Role Name <b>*</b></span>
        <input class="form-control" id="mrcRoleName" name="name" maxlength="80" required placeholder="e.g. Regional Financial Operator" autocomplete="off"/>
        <small>A clear title describing this role's responsibility across the system.</small>
      </label>
    </section>

    <section class="mrc-card mrc-perm-card">
      <header class="mrc-perm-head">
        <div class="mrc-perm-title">
          <span class="mrc-card-icon is-sliders" aria-hidden="true"><i class="bi bi-sliders"></i></span>
          <div>
            <h3>Role Permissions</h3>
            <p>Select the modules and access levels allowed for this role.</p>
          </div>
        </div>
        <div class="mrc-perm-tools">
          <span class="mrc-selected-pill" id="mrcSelectedPill">0 / 0 Selected</span>
          <button class="mrc-chip-btn is-accent" type="button" id="mrcExpandAll"><i class="bi bi-magic" aria-hidden="true"></i> Toggle All</button>
          <button class="mrc-chip-btn" type="button" id="mrcSelectAll"><i class="bi bi-check-circle" aria-hidden="true"></i> Select All</button>
          <button class="mrc-chip-btn" type="button" id="mrcDeselectAll"><i class="bi bi-x-lg" aria-hidden="true"></i> Clear</button>
        </div>
      </header>

      <div class="mrc-filter-row">
        <label class="mp-search mrc-search" for="mrcFilter">
          <i class="bi bi-search" aria-hidden="true"></i>
          <input id="mrcFilter" type="search" placeholder="Filter menus, endpoints, or slug..." autocomplete="off"/>
        </label>
      </div>

      <div class="mp-matrix mrc-matrix" id="mrcCheckList">
        <div class="permission-empty">Loading menus...</div>
      </div>
      <div class="upload-status mt-3" id="mrcStatus"></div>
    </section>
  </form>

  <footer class="mrc-sticky-footer" id="mrcFooter">
    <div class="mrc-footer-meta">
      <span class="mrc-footer-icon" aria-hidden="true"><i class="bi bi-shield-check"></i></span>

        <span class="mrc-ready" id="mrcReadyBadge">DRAFT</span>
        <em id="mrcFooterHint">Configure a role name and permissions to continue.</em>
      </div>
    </div>
    <div class="mrc-footer-actions">
      <a data-bo-spa-link class="mrc-btn mrc-btn-ghost" href="menu-permission.html">Cancel</a>
      <button class="mrc-btn mrc-btn-primary" type="submit" form="mrcForm" id="mrcSaveBottom"><i class="bi bi-floppy"></i> Save Role</button>
