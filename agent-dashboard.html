    <title>Agent Dashboard</title>
    <style>
        .rounded-select-wrap{width:25% !important}
    </style>
<link href="assets/css/bo-global-quicknav.css?v=0d429385" rel="stylesheet" data-bo-quicknav-css="1"></head>

<body class="report-body agent-report-body agent-modern bo-charcoal bo-account-chip" data-agent-page="dashboard">
    <div class="report-shell">
        <aside class="report-sidebar" id="reportSidebar">
            <div class="report-brand">
                <div>Backoffice
                </div><button class="close-side" data-close-sidebar><i class="bi bi-x-lg"></i></button>
            </div>
            <nav class="report-nav" id="agentPortalNav"></nav>
            <div id="agentSidebarFooter"></div>
        </aside>
        <div class="sidebar-overlay" data-close-sidebar id="reportOverlay"></div>
        <main class="report-main">
            <header class="agent-modern-head"><button class="hamb" data-open-sidebar><i class="bi bi-list"></i></button>
                <div>
                    <h1>Dashboard</h1>
                    <p id="agentGreeting">Here's your business overview for today.</p>
                </div>
                <div class="agent-head-actions">
                    <div class="field agent-header-date-source"><label>From</label><input data-range-default="today"
                            id="agentDashFrom" type="date"></div>
                    <div class="field agent-header-date-source"><label>To</label><input id="agentDashTo" type="date">
                    </div><small id="agentLastUpdated"></small>
                <div class="report-actions">
    <button type="button" class="bo-theme-btn" id="boThemeToggle" aria-pressed="false" title="Switch to dark mode" aria-label="Switch to dark mode">
      <i class="bi bi-sun-fill" data-theme-icon="sun"></i>
      <i class="bi bi-moon-fill" data-theme-icon="moon" hidden></i>
    </button>
    <div id="agentTopProfile"></div>
  </div>
  </div>
            </header>
            <section class="report-content agent-dashboard-content">
                <div class="agent-kpi-cards" id="agentHeroMetrics"></div>
                <div class="agent-dashboard-grid">
                    <section class="agent-panel">
                        <div class="agent-panel-title">
                            <h2><i class="bi bi-people"></i> Player Overview</h2>
                        </div>
                        <div id="agentPlayerOverview"></div>
                    </section>
                    <section class="agent-panel">
                        <div class="agent-panel-title">
                            <h2><i class="bi bi-graph-up-arrow"></i> Performance <span>(Today)</span></h2>
                        </div>
                        <div id="agentPerformance"></div>
                    </section>
                    <section class="agent-panel agent-trend-panel">
                        <div class="agent-panel-title">
                            <h2><i class="bi bi-bezier2"></i> Commission Trend <span>(30 Days)</span></h2><select
                                id="agentTrendDays"
                                style="width:92px!important;min-width:92px!important;max-width:92px!important;flex:0 0 92px!important;">
                                <option value="30">30 Days</option>
                                <option value="14">14 Days</option>
                                <option value="7">7 Days</option>
                            </select>
                        </div>
                        <div id="agentTrendChart" class="agent-line-chart"></div>
                    </section>
                </div>
                <div class="agent-dashboard-lower">
                    
                    <section class="agent-panel">
                        <div class="agent-panel-title">
                            <h2><i class="bi bi-wallet2"></i> Recent Transactions</h2><a href="agent-wallet.html">View
                                All</a>
                        </div>
                        <div class="table-wrap">
                            <table class="agent-mini-table">
                                <thead>
                                    <tr>
                                        <th>Type</th>
                                        <th>Amount</th>
                                        <th>Status</th>
                                        <th>Date</th>
                                    </tr>
                                </thead>
                                <tbody id="agentRecentTransactions"></tbody>
                            </table>
                        </div>
                    </section>
                </div>
                <section class="agent-panel agent-quick-panel">
                    <div class="agent-panel-title">
                        <h2><i class="bi bi-lightning-charge"></i> Quick Access</h2>
                    </div>
                    <div class="agent-quick-grid"><a href="agent-bet-report.html"><i
                                class="bi bi-controller"></i><span>Top Games</span></a><a
                            href="agent-bet-report.html"><i class="bi bi-file-earmark-text"></i><span>Bet
                                Report</span></a><a href="agent-settlement.html"><i
                                class="bi bi-cash-stack"></i><span>Commission Report</span></a><a
                            href="agent-wallet.html"><i class="bi bi-wallet2"></i><span>Wallet</span></a><a
                            href="agent-profile.html"><i class="bi bi-megaphone"></i><span>Settings</span></a></div>
                </section>
            </section>
        </main>
    </div>
