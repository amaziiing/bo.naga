  }catch(e){}

<link href="assets/css/main-report-charcoal.css?v=cb596e10" rel="stylesheet"/>
<link href="assets/css/main-report-charcoal-content.css?v=a6e0d760" rel="stylesheet"/>

<link href="assets/css/main-mobile-responsive.css?v=d7737bec" rel="stylesheet">

<body class="report-body standardized-listing-page main-admin-detail-page main-report-exec-page main-win-lose-page bo-account-chip" data-access-page="main_report" data-report-view="winlose">
<div class="report-shell">
<aside class="report-sidebar" id="reportSidebar">
<div class="report-brand"><div>Backoffice</div><button class="close-side" data-close-sidebar><i class="bi bi-x-lg"></i></button></div>
<nav class="report-nav"></nav>
</aside>
<div class="sidebar-overlay" data-close-sidebar></div>
<main class="report-main">
<header class="report-topbar">
  <button class="hamb" data-open-sidebar><i class="bi bi-list"></i></button>
  <div class="user-title-wrap">
    <div class="user-title-icon"><i class="bi bi-graph-up-arrow"></i></div>
    <div>
      <h1>Win/Lose Report</h1>
    </div>
  </div>
  <div class="report-actions">
    <button type="button" class="bo-theme-btn" id="boThemeToggle" aria-pressed="false" title="Switch to dark mode" aria-label="Switch to dark mode">
      <i class="bi bi-sun-fill" data-theme-icon="sun"></i>
      <i class="bi bi-moon-fill" data-theme-icon="moon" hidden></i>
    </button>
    <div data-bo-profile></div>
  </div>
</header>

<section class="report-content mad-workspace mre-workspace">
  <div class="mad-chrome mre-chrome">
    <div class="mad-tabs mre-tabs" role="tablist" aria-label="Report sections">
      <a class="mad-tab mre-tab is-active" role="tab" aria-selected="true" href="main-win-lose-report.html" data-report-tab="winlose" data-permission-url="main-win-lose-report.html,main_provider_report.html" aria-current="page">Win/Lose Report</a>
      <a class="mad-tab mre-tab" role="tab" aria-selected="false" href="main_provider_report.html" data-report-tab="provider" data-permission-url="main_provider_report.html">Provider Report</a>
    </div>
  </div>

  <div class="mad-panel mre-panel" data-report-panel="winlose">
    <div class="mad-filter-bar mre-filter-bar">
      <div class="mad-pills" role="group" aria-label="Merchant status" data-bo-seg-anim="bounce">
        <button type="button" class="mad-pill" data-wl-status="active" aria-pressed="false">Active <span class="mad-pill-count is-active-count" id="wlCountActive">0</span></button>
        <button type="button" class="mad-pill" data-wl-status="suspended" aria-pressed="false">Suspended <span class="mad-pill-count is-danger-count" id="wlCountSuspended">0</span></button>
        <button type="button" class="mad-pill is-active" data-wl-status="all" aria-pressed="true">All <span class="mad-pill-count" id="wlCountAll">0</span></button>
      </div>
      <div class="mad-filters">
        <div class="mre-period-group">
          <div class="field ref-date-field mre-date-field main-mod-date main-exec-date-field">
            <input type="hidden" id="winLoseFrom"/>
            <input type="hidden" id="winLoseTo"/>
            <div class="ref-range-wrap">
              <button class="ref-range-trigger mre-date-trigger" id="winLoseDateTrigger" type="button" aria-label="Select date range" aria-expanded="false">
                <span class="ref-range-icon"><i class="bi bi-calendar3"></i></span>
                <span id="winLoseDateLabel">Select date range</span>
                <i class="bi bi-chevron-down ms-auto"></i>
              </button>
              <div class="ref-range-picker" id="winLoseRangePicker">
                <div class="ref-range-presets">
                  <button data-winlose-preset="today" type="button">Today</button>
                  <button data-winlose-preset="yesterday" type="button">Yesterday</button>
                  <button data-winlose-preset="thisWeek" type="button">This Week</button>
                  <button data-winlose-preset="lastWeek" type="button">Last Week</button>
                  <button data-winlose-preset="thisMonth" type="button">This Month</button>
                  <button data-winlose-preset="lastMonth" type="button">Last Month</button>
                  <button data-winlose-preset="thisYear" type="button">This Year</button>
                  <button data-winlose-preset="lastYear" type="button">Last Year</button>
                </div>
                <div class="ref-range-calendar">
                  <div class="ref-cal-head">
                    <button id="winLoseCalPrev" type="button"><i class="bi bi-chevron-left"></i></button>
                    <button class="ref-head-pick" id="winLoseCalMonth" type="button"></button>
                    <button class="ref-head-pick" id="winLoseCalYear" type="button"></button>
                    <button id="winLoseCalNext" type="button"><i class="bi bi-chevron-right"></i></button>
                  </div>
                  <div class="ref-cal-month-grid" id="winLoseCalMonthGrid"></div>
                  <div class="ref-cal-year-grid" id="winLoseCalYearGrid"></div>
                  <div class="ref-cal-day-view" id="winLoseCalDayView">
                    <div class="ref-cal-week"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
                    <div class="ref-cal-days" id="winLoseCalDays"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <label class="mad-search mre-search" for="wlSearchInput">
          <i class="bi bi-search" aria-hidden="true"></i>
          <input id="wlSearchInput" type="search" placeholder="Search by merchant name..." autocomplete="off"/>
        </label>
        <select class="mad-select" id="wlTierFilter" aria-label="Tier">
          <option value="">All Tiers</option>
          <option value="1">Tier 1 Enterprise</option>
          <option value="2">Tier 2 Premium</option>
          <option value="3">Tier 3 Standard</option>
          <option value="wl">White Label VIP</option>
        </select>
        <select class="mad-select" id="wlStatusFilter" aria-label="Status">
          <option value="">All Status</option>
          <option value="active">Active</option>
          <option value="suspended">Suspended</option>
        </select>
        <button class="mad-btn mad-btn-ghost mad-reset-btn" type="button" id="wlResetBtn"><i class="bi bi-arrow-counterclockwise"></i> Reset</button>
        <button class="mad-btn mad-btn-ghost mad-export-btn" type="button" id="reportExport"><i class="bi bi-upload" aria-hidden="true"></i> Export</button>
      </div>
    </div>

    <div class="mre-scope-bar" aria-label="Currency">
      <div class="mre-currency-group">
        <span class="mre-scope-label">Currency</span>
        <div class="mre-currency-seg" role="group" aria-label="Currency" id="wlCurrencySeg">
          <span class="mre-cur-loading" aria-hidden="true">…</span>
        </div>
      </div>

    </div>

    <div class="mad-table-wrap report-table-scroll mre-scroll-table wl-scroll-table">
      <table class="mad-table mre-table wl-table">
        <thead>
          <tr>
            <th>Merchant</th>
            <th class="mre-num">Total Bet</th>
            <th class="mre-num">Total ValidBet</th>
            <th class="mre-num">Total In</th>
            <th class="mre-num">Total Out</th>
            <th class="mre-num">Total Win/Lose</th>
          </tr>
        </thead>
        <tbody id="wlRows">
          <tr><td colspan="6" class="mad-empty">Loading win/lose report…</td></tr>
        </tbody>
        <tfoot id="wlFoot" hidden>
          <tr class="mre-total-row">
            <td><span class="mre-total-label"><i class="bi bi-sigma"></i> Total <span class="mre-cur-label">(MYR)</span></span></td>
            <td class="mre-num" id="wlTotalBet">0.00</td>
            <td class="mre-num" id="wlTotalValid">0.00</td>
            <td class="mre-num" id="wlTotalIn">0.00</td>
            <td class="mre-num" id="wlTotalOut">0.00</td>
            <td class="mre-num" id="wlTotalWinLose">0.00</td>
          </tr>
        </tfoot>
      </table>
    </div>

    <div class="mad-footer wl-footer">
      <label class="mad-page-size-control entries-control" for="wlPageSize">Show
        <select id="wlPageSize" class="mad-page-size-select" aria-label="Rows per page">
          <option value="-" selected>-</option>
          <option value="10">10</option>
          <option value="20">20</option>
          <option value="50">50</option>
          <option value="100">100</option>
          <option value="All">All</option>
        </select>
        <span>entries</span>
      </label>
      <div class="mad-footer-info" id="wlInfo">Showing 0 to 0 of 0 merchants</div>
      <div class="mad-footer-right">
        <nav class="mad-pager" id="wlPager" aria-label="Table pagination"></nav>
      </div>
    </div>
  </div>
</section>
</main>
</div>

<script src="assets/js/main-win-lose-report.js?v=8c207333"></script>

</body>
</html>
