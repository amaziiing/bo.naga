  <body class="report-body bo-charcoal bo-account-chip image-to-url-page">
    <div class="report-shell">
      <aside class="report-sidebar" id="reportSidebar">
          <div class="report-brand">
              <div>Backoffice</div><button class="close-side" data-close-sidebar><i
                      class="bi bi-x-lg"></i></button>
          </div>
          <nav class="report-nav"></nav>
      </aside>
      <div class="sidebar-overlay" id="reportOverlay" data-close-sidebar></div>
      <main class="report-main">
        <header class="report-topbar" data-bo-topbar data-bo-title="Image To URL" data-bo-icon="bi-link-45deg"></header>
<script src="assets/js/bo-topbar.js?v=a7466d81"></script>
        <section class="report-content">
          <article class="image-url-card" aria-labelledby="imageUrlTitle">
            <header class="image-url-head">
              <div>
                <h2 id="imageUrlTitle"><i class="bi bi-image" aria-hidden="true"></i> Image To URL</h2>
                <p>Upload once, copy a public URL for banners, CSS, and CMS media.</p>
              </div>
              <span class="image-url-badge">Max width 1500 px</span>
            </header>

            <div class="image-url-body">
              <div class="upload-drop-zone" id="dropZone" role="button" tabindex="0" aria-label="Choose image or drag image here">
                <input type="file" id="imageInput" accept="image/*" aria-hidden="true" tabindex="-1" />
                <div class="upload-help">
                  <i class="bi bi-cloud-arrow-up" aria-hidden="true"></i>
                  <strong>Choose image or drag image here</strong>
                </div>
                <small>JPG, PNG, GIF, WEBP. The API returns a public URL.</small>
              </div>

              <div class="upload-preview-wrap" id="previewWrap" hidden>
                <img id="imagePreview" alt="Selected preview" />
                <div>
                  <b id="fileNameText">Selected image</b>
                  <small id="fileSizeText"></small>
                </div>
              </div>

              <div class="upload-actions-row">
                <button class="clean-btn primary" id="uploadBtn" type="button"><i class="bi bi-upload" aria-hidden="true"></i> Upload Image</button>
                <button class="clean-btn" id="clearBtn" type="button"><i class="bi bi-x-circle" aria-hidden="true"></i> Clear</button>
              </div>

              <div class="upload-status" id="uploadStatus" role="status"></div>

              <div class="image-url-result">
                <label for="imageUrl">Uploaded Image URL</label>
                <div class="copy-row">
                  <input id="imageUrl" type="text" placeholder="https://static.yourdomain.com/media/image.png" readonly />
                  <button class="copy-btn" id="copyUrlBtn" type="button"><i class="bi bi-clipboard" aria-hidden="true"></i> COPY</button>
                </div>
              </div>

              <div class="image-url-result">
                <label for="cssCode">CSS Background Code</label>
                <div class="copy-row copy-row-textarea">
                  <textarea id="cssCode" rows="3" readonly placeholder="background-image: url('...');"></textarea>
                  <button class="copy-btn" id="copyCssBtn" type="button"><i class="bi bi-clipboard" aria-hidden="true"></i> COPY</button>
                </div>
              </div>
            </div>
          </article>
        </section>
      </main>
    </div>
