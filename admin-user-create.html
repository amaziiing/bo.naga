<section class="mac-section">
<header class="mac-section-head"><span class="mac-section-icon" aria-hidden="true"><i class="bi bi-person-plus"></i></span><h3>Account Credentials</h3></header>
<div class="mac-fields mac-fields-row"><label class="mac-field"><span class="mac-label">Username <b>*</b></span><input class="form-control" id="newAdminUsername" type="text" placeholder="Enter username" /></label><label class="mac-field"><span class="mac-label">Display Name <b>*</b></span><input class="form-control" id="newAdminDisplayName" type="text" placeholder="Enter display name" /></label><label class="mac-field"><span class="mac-label">Password <b>*</b></span><span class="mad-pass-wrap"><input class="form-control" id="newAdminPassword" type="password" placeholder="Enter password" autocomplete="new-password" /><small class="mac-field-help" id="newAdminPasswordHelp" hidden>Leave empty to keep the current password.</small><button class="mad-eye" type="button" data-pass-toggle="newAdminPassword" aria-label="Show password"><i class="bi bi-eye"></i></button></span></label><label class="mac-field"><span class="mac-label">Confirm Password <b>*</b></span><span class="mad-pass-wrap"><input class="form-control" id="newAdminConfirmPassword" type="password" placeholder="Confirm password" autocomplete="new-password" /><button class="mad-eye" type="button" data-pass-toggle="newAdminConfirmPassword" aria-label="Show password"><i class="bi bi-eye"></i></button></span></label></div>
</section>
<section class="mac-section">
<header class="mac-section-head"><span class="mac-section-icon" aria-hidden="true"><i class="bi bi-shield-lock"></i></span><h3>Access &amp; Scope</h3></header>
<div class="mac-fields mac-fields-row"><label class="mac-field"><span class="mac-label">Role <b>*</b></span><select class="form-control" id="newAdminRole"></select></label><label class="mac-field"><span class="mac-label">Status <b>*</b></span><select class="form-control" id="newAdminStatus"><option value="" selected>Select status</option><option value="1">Active</option><option value="0">Inactive</option></select></label><label class="mac-field"><span class="mac-label">Branding Scope</span><select class="form-control" id="newAdminBrand"></select></label><label class="mac-field"><span class="mac-label">Permission Group</span><select class="form-control" id="newAdminPermissionGroup"></select></label><label class="mac-field mac-field-full"><span class="mac-label">Remark</span><textarea class="form-control" id="newAdminRemark" rows="5" maxlength="200" placeholder="Enter remark (optional)"></textarea><small class="mac-help" id="newAdminRemarkCount">0/200</small></label></div>
</section>
<div class="upload-status mb-3" id="createAdminStatus"></div>
<footer class="mac-footer-actions">
