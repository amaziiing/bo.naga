<section class="report-content tz-page">
  <article class="tz-panel" aria-labelledby="tzPanelTitle">
    <header class="tz-panel-head">
      <h2 id="tzPanelTitle"><i class="bi bi-clock-history" aria-hidden="true"></i> Backoffice Timezone</h2>
      <p>Controls how dates and day boundaries appear across reports, dashboards, and settlement views.</p>
    </header>

    <div class="tz-panel-body">
      <div class="tz-live" aria-live="polite">
        <p class="tz-live-label">Preview · selected zone</p>
        <p class="tz-live-clock" id="tzLiveClock">--:--:--</p>
        <div class="tz-live-meta">
          <span id="tzLiveCity">Kuala Lumpur</span>
          <span class="tz-offset-pill" id="tzLiveOffset">GMT+8</span>
          <span id="tzLiveIana">Asia/Kuala_Lumpur</span>
        </div>
      </div>

      <div class="tz-field">
        <label for="timezonePreference">Region</label>
        <select id="timezonePreference">
          <option value="Asia/Kuala_Lumpur">GMT+8 · Kuala Lumpur</option>
          <option value="Asia/Singapore">GMT+8 · Singapore</option>
          <option value="Asia/Manila">GMT+8 · Manila</option>
          <option value="Asia/Hong_Kong">GMT+8 · Hong Kong</option>
          <option value="Asia/Bangkok">GMT+7 · Bangkok</option>
          <option value="Asia/Jakarta">GMT+7 · Jakarta</option>
          <option value="UTC">GMT+0 · UTC</option>
        </select>
        <p class="tz-hint">Applies after save. Other open tabs pick up the change on reload.</p>
      </div>
    </div>

    <footer class="tz-panel-foot">
      <div class="tz-status" id="timezoneStatus" role="status"></div>
      <button type="button" class="btn-primary-clean" id="saveTimezone">
        <i class="bi bi-save" aria-hidden="true"></i> Save Timezone
      </button>
    </footer>
  </article>
</section>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var select = document.getElementById('timezonePreference');
  var statusEl = document.getElementById('timezoneStatus');
  var clockEl = document.getElementById('tzLiveClock');
  var cityEl = document.getElementById('tzLiveCity');
  var offsetEl = document.getElementById('tzLiveOffset');
  var ianaEl = document.getElementById('tzLiveIana');
  var timer = null;

  function parseOptionLabel(text) {
    var parts = String(text || '').split(/\s*·\s*/);
    return {
      offset: (parts[0] || '').trim() || 'GMT',
      city: (parts[1] || parts[0] || '').trim() || '—'
    };
  }

  function selectedZone() {
    return select.value || 'Asia/Kuala_Lumpur';
  }

  function updateMeta() {
    var opt = select.options[select.selectedIndex];
    var parsed = parseOptionLabel(opt ? opt.text : '');
    cityEl.textContent = parsed.city;
    offsetEl.textContent = parsed.offset;
    ianaEl.textContent = selectedZone();
  }

  function renderClock() {
    var zone = selectedZone();
    var now = new Date();
    try {
      var parts = new Intl.DateTimeFormat('en-GB', {
        timeZone: zone,
        year: 'numeric',
        month: 'short',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hourCycle: 'h23'
      }).formatToParts(now);
      var v = {};
      parts.forEach(function (p) {
        if (p.type !== 'literal') v[p.type] = p.value;
      });
      clockEl.textContent =
        v.day + ' ' + v.month + ' ' + v.year + '  ' + v.hour + ':' + v.minute + ':' + v.second;
    } catch (_) {
      clockEl.textContent = now.toLocaleString();
    }
  }

  function refreshPreview() {
    updateMeta();
    renderClock();
  }

  select.value = localStorage.getItem('bo_timezone') || 'Asia/Kuala_Lumpur';
  refreshPreview();
  timer = setInterval(renderClock, 1000);
  select.addEventListener('change', function () {
    statusEl.textContent = '';
    statusEl.className = 'tz-status';
    refreshPreview();
  });

  document.getElementById('saveTimezone').addEventListener('click', function () {
    var opt = select.options[select.selectedIndex];
    localStorage.setItem('bo_timezone', select.value);
    statusEl.className = 'tz-status is-success';
    statusEl.textContent = 'Saved. Reloaded pages will use ' + (opt ? opt.text : select.value) + '.';
    try {
      window.dispatchEvent(new StorageEvent('storage', { key: 'bo_timezone', newValue: select.value }));
    } catch (_) {}
  });

  window.addEventListener('beforeunload', function () {
    if (timer) clearInterval(timer);
  });
});
</script>
