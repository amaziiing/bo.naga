<body class="report-body brand-agent-standard brand-detail-page bo-charcoal bo-account-chip" data-access-page="brand_management">
<div class="report-shell">
  <aside class="report-sidebar" id="reportSidebar">
    <div class="report-brand"><div>Backoffice</div><button class="close-side" data-close-sidebar><i class="bi bi-x-lg"></i></button></div>
    <nav class="report-nav"></nav>
  </aside>
  <div class="sidebar-overlay" data-close-sidebar></div>
  <main class="report-main">
    <header class="report-topbar brand-detail-topbar">
      <button class="hamb" data-open-sidebar><i class="bi bi-list"></i></button>
      <div></div>
      <div class="report-actions">
      <button type="button" class="bo-theme-btn" id="boThemeToggle" aria-pressed="false" title="Switch to dark mode" aria-label="Switch to dark mode">

      <div data-bo-profile></div>
    </div>
    </header>

        <div class="brand-detail-actions">

          <button class="brand-detail-btn primary" id="brandDetailManage" type="button"><i class="bi bi-gear"></i> Manage Brand</button>
        </div>
      </div>

      <div class="brand-detail-identity">
        <div class="brand-detail-avatar" id="brandDetailAvatar">B</div>
        <div class="brand-detail-name-wrap">
          <div class="brand-detail-name-line"><h1 id="brandDetailName">Brand</h1><span class="brand-detail-status" id="brandDetailStatus">Active</span></div>
          <div class="brand-detail-meta"><span id="brandDetailCode">-</span><span>·</span><span id="brandDetailDomain">-</span></div>
        </div>
      </div>

      <div class="brand-detail-kpis">

        <div class="brand-detail-kpi"><span>Turnover</span><strong id="brandKpiTurnover">0.00</strong></div>
        <div class="brand-detail-kpi"><span>Bets Placed</span><strong id="brandKpiBets">0</strong></div>
        <div class="brand-detail-kpi"><span>Active Players</span><strong id="brandKpiPlayers">0</strong></div>

      <div class="brand-detail-tabs" role="tablist">

        <button type="button" data-brand-tab="transactions">Transactions</button>
        <button type="button" data-brand-tab="settlements">Settlement Records</button>
        <button type="button" data-brand-tab="adjustments">Adjustment Records <span class="brand-tab-count" id="brandAdjustmentCount" hidden>0</span></button>
