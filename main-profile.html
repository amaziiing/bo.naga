    <aside class="report-sidebar" id="reportSidebar">
      <div class="report-brand"><div>Backoffice</div><button class="close-side" data-close-sidebar><i class="bi bi-x-lg"></i></button></div>

<script src="assets/js/bo-topbar.js?v=a7466d81"></script>
      <section class="report-content">
        <div class="admin-wide-section">
          <div class="admin-form-card admin-wide-card admin-profile-card">
            <div class="admin-card-head">
              <div>
                <h2>My Profile</h2>
                <p>Update your own admin username and display name.</p>
              </div>
              <div class="admin-card-icon"><i class="bi bi-person-circle"></i></div>
            </div>
            <form id="profileForm" class="admin-profile-form">
              <div class="admin-create-form-grid two">
                <div class="admin-field">
                  <label>Username</label>
                  <input class="form-control" id="profileUsername" required>
                </div>
                <div class="admin-field">
                  <label>Display Name</label>
                  <input class="form-control" id="profileDisplayName">
                </div>
              </div>
              <div class="upload-status mb-3" id="profileStatus"></div>
              <button class="clean-btn primary" type="submit"><i class="bi bi-save"></i> Save Profile</button>
            </form>
          </div>

          <div class="admin-form-card admin-wide-card admin-password-card mt-3" id="password">
            <div class="admin-card-head">
              <div>
                <h2>Change Password</h2>
                <p>Enter your current password, then set a new password with minimum 8 characters.</p>
              </div>
              <div class="admin-card-icon"><i class="bi bi-key"></i></div>
            </div>
            <form id="changePasswordForm">
              <div class="admin-create-form-grid three">
                <div class="admin-field">
                  <label>Current Password</label>
                  <input class="form-control" id="currentPassword" type="password" required>
                </div>
                <div class="admin-field">
                  <label>New Password</label>
                  <input class="form-control" id="newPassword" type="password" minlength="8" required>
                </div>
                <div class="admin-field">
                  <label>Confirm New Password</label>
                  <input class="form-control" id="confirmPassword" type="password" minlength="8" required>
                </div>
              </div>
              <div class="upload-status mb-3" id="changePasswordStatus"></div>
              <button class="clean-btn primary" type="submit"><i class="bi bi-key"></i> Change Password</button>
            </form>
          </div>
        </div>
      </section>
