<body class="report-body standardized-listing-page main-admin-detail-page main-merchant-profit-record-page bo-account-chip" data-access-page="main_merchant_detail">
<div class="report-shell">
<aside class="report-sidebar" id="reportSidebar">
  <div class="report-brand"><div>Backoffice</div><button class="close-side" data-close-sidebar="" type="button"><i class="bi bi-x-lg"></i></button></div>
  <nav class="report-nav"></nav>
</aside>
<div class="sidebar-overlay" data-close-sidebar=""></div>
<main class="report-main">
<header class="report-topbar">
  <button class="hamb" data-open-sidebar="" type="button"><i class="bi bi-list"></i></button>
  <div class="user-title-wrap">
    <div class="user-title-icon"><i class="bi bi-plus-lg"></i></div>
    <div>
      <h1>Record Profit <span class="mprr-title-badge">Revenue Ledger Entry</span></h1>
    </div>
  </div>
  <div class="report-actions">
    <button type="button" class="bo-theme-btn" id="boThemeToggle" aria-pressed="false" title="Switch to dark mode" aria-label="Switch to dark mode">
      <i class="bi bi-sun-fill" data-theme-icon="sun"></i>
      <i class="bi bi-moon-fill" data-theme-icon="moon" hidden></i>
    </button>
    <div data-bo-profile=""></div>
  </div>
</header>

<section class="report-content mprr-workspace">
  <form id="mprrForm" class="mprr-form" novalidate>
    <section class="mprr-card">
      <header class="mprr-card-head">
        <div class="mad-pills mprr-mode-switch" role="group" aria-label="Record type" data-bo-seg-anim="bounce">
          <button type="button" class="mad-pill mprr-mode-btn is-active" data-mprr-mode="monthly" aria-pressed="true">
            <i class="bi bi-calendar2-week" aria-hidden="true"></i>
            <span>Monthly Recurring Pricing</span>
          </button>
          <button type="button" class="mad-pill mprr-mode-btn" data-mprr-mode="oneoff" aria-pressed="false">
            <i class="bi bi-receipt" aria-hidden="true"></i>
            <span>One-off / Ad-hoc Income</span>
          </button>
        </div>
        <a data-bo-spa-link class="mad-btn mad-btn-ghost mprr-back" href="main-merchant-profit.html"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back to Merchant Profit</a>
      </header>

      <div class="mprr-grid">
        <div class="mprr-field">
          <span class="mprr-label" id="mprrMerchantLabel">Target Merchant <b>*</b></span>
          <select class="form-select mad-select" id="mprrMerchant" data-bo-auto-width="0" required aria-labelledby="mprrMerchantLabel">
            <option value="">Select Merchant</option>
          </select>
        </div>

        <label class="mprr-field" for="mprrFeeName">
          <span class="mprr-label">Fee / Income Item <b>*</b></span>
          <input class="form-control" id="mprrFeeName" maxlength="120" placeholder="e.g. Server &amp; Infrastructure Fee" required/>
        </label>

        <div class="mprr-field mprr-entry-type">
          <span class="mprr-label" id="mprrEntryTypeLabel">Entry Type <b>*</b></span>
          <select class="form-select mad-select" id="mprrEntryType" data-bo-auto-width="0" aria-labelledby="mprrEntryTypeLabel">
            <option value="continue">Monthly Recurring Rule</option>
            <option value="stop">Stop Recurring Billing</option>
          </select>
        </div>


        <div class="mprr-field">
          <span class="mprr-label" id="mprrCurrencyLabel">Transaction Currency <b>*</b></span>
          <select class="form-select mad-select" id="mprrCurrency" data-bo-auto-width="0" required aria-labelledby="mprrCurrencyLabel">
            <option value="">Select Currency</option>
          </select>
        </div>

        <div class="mprr-field">
          <span class="mprr-label" id="mprrDirectionLabel">Money Flow <b>*</b></span>
          <select class="form-select mad-select" id="mprrDirection" data-bo-auto-width="0" required aria-labelledby="mprrDirectionLabel">
            <option value="COLLECT">Collect From Merchant (+)</option>
            <option value="PAY">Pay To Merchant (-)</option>
          </select>
        </div>

        <label class="mprr-field" for="mprrDate">
          <span class="mprr-label" id="mprrDateLabel">Effective Date <b>*</b></span>
          <span class="mprr-date-wrap">
            <input class="form-control" type="date" id="mprrDate" required/>
            <i class="bi bi-calendar3" aria-hidden="true"></i>
          </span>
        </label>

        <label class="mprr-field" for="mprrAmount">
          <span class="mprr-label">Amount (<span id="mprrAmountCurrency">—</span>) <b>*</b></span>
          <span class="mprr-amount-wrap mac-input-group is-prefix">
            <span class="mprr-amount-prefix mac-input-addon" id="mprrAmountPrefix">—</span>
            <input class="form-control" id="mprrAmount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00" required/>
            <span class="mprr-amount-tag">gross</span>
          </span>
        </label>

        <label class="mprr-field mprr-field-full" for="mprrRemark">
          <span class="mprr-label">Remark / Internal Note <span class="mprr-optional">Optional</span></span>
          <textarea class="form-control" id="mprrRemark" rows="4" maxlength="1000" placeholder="Optional remark or internal note for this profit record..."></textarea>
        </label>
      </div>

      <div class="upload-status mprr-status" id="mprrStatus" hidden></div>
    </section>

    <footer class="mprr-footer">
      <div class="mprr-draft" id="mprrDraft">
        <span class="mprr-draft-dot" aria-hidden="true"></span>
        <span id="mprrDraftText">Draft cached locally · Just now</span>
      </div>
      <div class="mprr-footer-actions">
        <a data-bo-spa-link class="mad-btn mad-btn-ghost" href="main-merchant-profit.html">Cancel</a>
        <button class="mad-btn mad-btn-navy" type="submit" id="mprrSubmitBtn">
          <i class="bi bi-check-lg" aria-hidden="true"></i>
          <span id="mprrSubmitLabel">Save &amp; Record Profit</span>
        </button>
      </div>
    </footer>
  </form>
</section>
</main>
