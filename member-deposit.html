<body class="report-body standardized-listing-page deposit-approval-page bo-wallet-tx">
<div class="report-shell">
<aside class="report-sidebar" id="reportSidebar">
<div class="report-brand">
<div>Backoffice</div><button class="close-side" data-close-sidebar=""><i class="bi bi-x-lg"></i></button>
</div>
<nav class="report-nav"></nav>
</aside>
<div class="sidebar-overlay" data-close-sidebar="" id="reportOverlay"></div>
<main class="report-main">
<header class="report-topbar" data-bo-topbar data-bo-title="Deposit Approval" data-bo-icon="bi-wallet2" data-bo-subtitle="Review and process member deposit requests."></header>
<script src="assets/js/bo-topbar.js?v=1"></script>
<section class="report-content">
<div class="quick-stats approval-pending-stats deposit-bank-card-stats" id="depositBankCards">
<article class="deposit-bank-card is-empty"><div class="deposit-bank-total"><span>Banks</span><strong>-</strong></div><div class="bo-summary-note">Loading bank totals...</div></article>
</div>
<div class="table-card">
<div class="filter-card deposit-inline-filter">
<div class="bo-tx-toolbar">
<nav class="bo-tx-tabs bo-seg" aria-label="Transaction type" data-bo-seg-anim="bounce">
<a class="bo-tx-tab is-active" href="member-deposit.html?tab=deposit" data-bo-tx-type="deposit" aria-current="page">Deposit <span class="bo-tx-tab-count" id="boTxCountDeposit">0</span></a>
<a class="bo-tx-tab" href="member-deposit.html?tab=withdraw" data-bo-tx-type="withdraw">Withdraw <span class="bo-tx-tab-count" id="boTxCountWithdraw">0</span></a>
<a class="bo-tx-tab" href="member-deposit.html?tab=all" data-bo-tx-type="all">All <span class="bo-tx-tab-count" id="boTxCountAll">0</span></a>
</nav>
<div class="user-search-grid bo-filter-row bo-tx-filter-controls">
<div class="field"><label>Date From</label><input id="depositFrom" type="date"/></div>
<div class="field"><label>Date To</label><input id="depositTo" type="date"/></div>
<div class="field"><label>Search</label><input id="depositKeyword" placeholder="Username / mobile / bank / reference"/></div>
<div class="field"><label>Status</label><select id="depositStatus"><option value="PENDING">Pending</option><option value="APPROVED">Approved</option><option value="REJECTED">Rejected</option><option value="ALL">All</option></select></div>
</div>
</div>
<select id="depositSize" hidden data-no-rounded="1" aria-hidden="true" tabindex="-1"><option value="-" selected>-</option><option value="10">10</option><option value="20">20</option><option value="50">50</option><option value="100">100</option><option value="All">All</option></select>
</div>
<div class="table-wrap">
<div class="bo-tx-table-head">
<table class="report-table bo-tx-head-table">
<colgroup>
<col class="bo-tx-col-date"/><col class="bo-tx-col-member"/><col class="bo-tx-col-amount"/><col class="bo-tx-col-method"/><col class="bo-tx-col-ref"/><col class="bo-tx-col-status"/><col class="bo-tx-col-processed"/><col class="bo-tx-col-action"/>
</colgroup>
<thead><tr>
<th>Date</th><th>Member</th><th>Amount</th><th>Bank</th><th>Reference</th><th>Status</th><th>Processed</th><th>Action</th>
</tr></thead>
</table>
</div>
<div class="bo-tx-table-body" id="depositTableScroll">
<table class="report-table bo-tx-body-table">
<colgroup>
<col class="bo-tx-col-date"/><col class="bo-tx-col-member"/><col class="bo-tx-col-amount"/><col class="bo-tx-col-method"/><col class="bo-tx-col-ref"/><col class="bo-tx-col-status"/><col class="bo-tx-col-processed"/><col class="bo-tx-col-action"/>
</colgroup>
<tbody id="depositBody"><tr><td colspan="8">Loading...</td></tr></tbody>
</table>
</div>
</div>
<div class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2 bo-deposit-pager-host">
<button class="clean-btn" id="depositPrevBtn" type="button">Previous</button>
<div id="depositPager" class="pagination-clean-inner" aria-label="Page numbers"></div>
<button class="clean-btn" id="depositNextBtn" type="button">Next</button>
</div>
</div>
</section>
