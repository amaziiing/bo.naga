<!DOCTYPE html>
<html lang="en">
<head>
<!-- Bonus Category Title is no longer its own page.
     A Promotion Bonus carries `bonusCategoryTitleId`, so a Bonus Category Title is
     the parent of a promotion, not a peer listing of the same data. Both levels now
     live on promotion.html: category rows expand into their promotions.

     This stub keeps the old URL alive so an existing bookmark, an unchanged sidebar
     row in Menu Management, and a role that only holds the `bonus_category_title`
     menu all land on the merged page instead of a 404. assets/js/auth.js maps that
     permission onto promotion.html for the same reason.

     Reference: the same convention bulk-bonus-adjustment.html uses to fold into
     bulk-adjustment.html. -->
<script>location.replace('promotion.html');</script>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta name="robots" content="noindex"/>
<title>Promotion Bonus</title>
</head>
<body>
<noscript><a href="promotion.html">Continue to Promotion Bonus</a></noscript>
</body>
</html>
