  try{
    if(localStorage.getItem('bo_theme')==='dark') document.documentElement.setAttribute('data-bo-theme','dark');
  }catch(e){}
})();
</script>

<body class="bo-report-family report-body standardized-listing-page provider-bet-report-page bo-charcoal bo-account-chip">
<div class="report-shell">
<aside class="report-sidebar" id="reportSidebar">
<div class="report-brand">
<div>Backoffice</div>
<button class="close-side" data-close-sidebar="" type="button"><i class="bi bi-x-lg"></i></button>
</div>
<nav class="report-nav"></nav>
</aside>
<div class="sidebar-overlay" data-close-sidebar="" id="reportOverlay"></div>
<main class="report-main">
<header class="report-topbar">
<button class="hamb" data-open-sidebar="" type="button"><i class="bi bi-list"></i></button>
<div class="user-title-wrap">
<div class="user-title-icon"><i class="bi bi-receipt"></i></div>
<div><h1>Provider Bet Report</h1></div>
</div>
<div class="report-actions">
<button type="button" class="bo-theme-btn" id="boThemeToggle" aria-pressed="false" title="Switch to dark mode" aria-label="Switch to dark mode">
<i class="bi bi-sun-fill" data-theme-icon="sun"></i>
<i class="bi bi-moon-fill" data-theme-icon="moon" hidden></i>
</button>
<div data-bo-profile></div>
</div>
</header>
<section class="report-content">
<div class="filter-card">
<div class="user-search-grid bo-filter-row">
<div class="field"><label>From</label><input class="form-control" id="betFrom" type="date"/></div>
<div class="field"><label>To</label><input class="form-control" id="betTo" type="date"/></div>
<div class="field"><label class="bo-search-control"><i class="bi bi-search" aria-hidden="true"></i><input class="form-control" id="betKeyword" type="search" placeholder="Member ID / Provider / Game Code" aria-label="Search Member ID, Provider, or Game Code" autocomplete="off"/></label></div>
<div class="field">
<select class="form-select" id="betEventType" aria-label="Event Type">
<option value="">All Event Types</option>
<option value="SESSION">SESSION</option>
<option value="BET">BET</option>
<option value="SETTLE">SETTLE</option>
<option value="CANCEL">CANCEL</option>
<option value="REFUND">REFUND</option>
</select>
</div>
</div>
</div>
<div class="table-card">
<div class="table-wrap">
<table class="report-table">
<thead>
<tr>
<th>ID</th><th>Member</th><th>Provider</th><th>Game</th><th>Bet ID</th><th>Event</th>
<th>Bet</th><th>Valid Bet</th><th>Win</th><th>Net</th><th>Created</th>
</tr>
</thead>
<tbody id="betBody"><tr><td colspan="11">Loading...</td></tr></tbody>
</table>
</div>
<div class="mad-footer">
<div class="entries-control">Show
<select id="betSize" aria-label="Rows per page">
<option value="-" selected>-</option>
<option value="10">10</option>
<option value="20">20</option>
<option value="50">50</option>
<option value="100">100</option>
<option value="All">All</option>
</select>
entries</div>
<div class="table-info mad-footer-info" id="betPageInfo">Showing 0 to 0 of 0 entries</div>
<nav class="pagination-clean mad-pager" id="betPager" aria-label="Table pagination"></nav>
</div>
</div>
</section>
</main>
</div>
