<div class="report-brand">
<div>Backoffice</div>
<button class="close-side" data-close-sidebar="">
<i class="bi bi-x-lg"></i>
</button>
</div>
<nav class="report-nav"></nav>
</aside>
<div class="sidebar-overlay" data-close-sidebar="" id="reportOverlay"></div>

<header class="report-topbar" data-bo-topbar data-bo-title="Admin Login Log" data-bo-icon="bi-clock-history"><span data-bo-topbar-title-extra class="users-found-badge" id="loginLogCount">0 Records</span></header>
<script src="assets/js/bo-topbar.js?v=1"></script>

<div class="quick-stats user-stats admin-stats">
<div class="user-metric purple">
<span class="metric-icon"><i class="bi bi-list-check"></i></span>
<div>
<span>Total Attempts</span><strong id="logStatTotal">0</strong><small>All recorded attempts</small>
</div>
</div>
<div class="user-metric green">
<span class="metric-icon"><i class="bi bi-check-circle"></i></span>
<div>
<span>Successful</span><strong id="logStatSuccess">0</strong><small>Successful logins</small>
</div>
</div>
<div class="user-metric orange">
<span class="metric-icon"><i class="bi bi-x-circle"></i></span>
<div>
<span>Failed</span><strong id="logStatFailed">0</strong><small>Failed attempts</small>
</div>
</div>
<div class="user-metric blue">
<span class="metric-icon"><i class="bi bi-calendar-day"></i></span>
<div>
<span>Today</span><strong id="logStatToday">0</strong><small>Attempts today</small>
</div>
</div>
</div>

</button>
<input id="refDateFrom" type="hidden"/><input id="refDateTo" type="hidden"/>
<div class="ref-range-picker" id="refRangePicker">
<div class="ref-range-presets">

                        Today
                      </button>
<button data-range-preset="yesterday" type="button">
                        Yesterday
                      </button>
<button data-range-preset="thisWeek" type="button">
                        This Week
                      </button>
<button data-range-preset="lastWeek" type="button">
                        Last Week
                      </button>
<button data-range-preset="thisMonth" type="button">
                        This Month
                      </button>
<button data-range-preset="lastMonth" type="button">

                      </button>

                      </button>
</div>

<i class="bi bi-chevron-left"></i>
</button>
<button class="ref-head-pick" id="refCalMonth" type="button"></button>
<button class="ref-head-pick" id="refCalYear" type="button"></button>

<i class="bi bi-chevron-right"></i>
</button>
</div>
<div class="ref-cal-month-grid" id="refCalMonthGrid"></div>
<div class="ref-cal-year-grid" id="refCalYearGrid"></div>
<div class="ref-cal-day-view" id="refCalDayView">

</div>
<div class="ref-cal-days" id="refCalDays"></div>
</div>
</div>
</div>
</div>
</div>
<div class="field">
<label>Admin / Username</label><label class="bo-search-control"><i class="bi bi-search" aria-hidden="true"></i><input id="loginLogSearch" placeholder="Search username or display name"/></label>
</div>
<div class="field">
<label>Status</label><select id="loginLogStatus">
<option value="">All Status</option>
<option value="SUCCESS">Success</option>
<option value="FAILED">Failed</option>
</select>
</div>
<div class="field">
<label>IP Address</label><label class="bo-search-control"><i class="bi bi-search" aria-hidden="true"></i><input id="loginLogIp" placeholder="Search IP address"/></label>
</div>
</div>

</div>
<div class="table-wrap">

<thead>
<tr>
<th>#</th>
<th>Login Time</th>
<th>Admin</th>
<th>Status</th>
<th>IP Address</th>
<th>User Agent</th>

</tr>
</thead>
<tbody id="loginLogBody">
<tr>
<td colspan="7">Loading...</td>
</tr>
</tbody>
</table>
</div>
