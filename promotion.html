<!--
  Promotion is ONE page with two levels.

  A Promotion Bonus carries `bonusCategoryTitleId`, so a Bonus Category Title is
  its parent, not a peer listing of the same data. This page renders the category
  rows and expands each one into the promotions that belong to it.

  Bonus Category Title used to be the separate page bonus-category-title.html; that
  file is now a redirect stub onto this page, so old bookmarks, the old sidebar row
  and roles that only hold the `bonus_category_title` menu all keep working
  (assets/js/auth.js maps that permission onto promotion.html).

  `page-bonus-category-title` on <body> is deliberate: it lets the parent row and
  the category form reuse that page's existing light/dark treatment instead of a
  second copy of it. Only the child panel is new — assets/css/promotion-workspace.css.
-->
<body class="report-body standardized-content-management promotion-workspace-page promotion-bonus-page page-bonus-category-title bo-charcoal bo-account-chip" data-crud-no-add="1">
<div class="report-shell">
<aside class="report-sidebar" id="reportSidebar">
<div class="report-brand">
<div>Backoffice</div><button class="close-side" data-close-sidebar=""><i class="bi bi-x-lg"></i></button>
</div>
<nav class="report-nav"></nav>
</aside>
<div class="sidebar-overlay" data-close-sidebar="" id="reportOverlay"></div>
<main class="report-main">
<header class="report-topbar" data-bo-topbar data-bo-title="Promotion Bonus" data-bo-icon="bi-megaphone"></header>
<script src="assets/js/bo-topbar.js?v=1"></script>
<section class="report-content">
<div class="manage-page-grid crud-list-only-grid">
<div class="manage-list-card game-modern-page promotion-modern-page promotion-workspace-card">
<div class="game-filter-card promotion-filter-card bo-filter-row" data-bo-filter-exempt="1">
<label><span class="promo-filter-label">Search Promotion</span><div class="category-search-control"><i class="bi bi-search" aria-hidden="true"></i><input id="promoWorkspaceSearch" placeholder="Search category or promotion" type="search" aria-label="Search category or promotion"/></div></label>
<label><span class="promo-filter-label">Status</span><select id="promoWorkspaceStatus" aria-label="Status" data-bo-auto-width="0"><option value="">All Statuses</option><option value="1">Active</option><option value="2">Inactive</option></select></label>
<label><span class="promo-filter-label">Sort By</span><select id="promoWorkspaceSort" aria-label="Sort By" data-bo-auto-width="0"><option value="sortAsc">Sort Order (Asc)</option><option value="sortDesc">Sort Order (Desc)</option><option value="nameAsc">Name (A-Z)</option><option value="nameDesc">Name (Z-A)</option></select></label>
<div class="section-title slider-list-title standardized-toolbar-title game-toolbar-title promotion-toolbar-actions">
<button class="clean-btn primary" id="promoAddCategoryBtn" type="button"><i class="bi bi-plus-lg" aria-hidden="true"></i><span class="btn-label">Add Bonus Category</span></button>
<a class="clean-btn primary" id="promoAddBtn" href="promotion-edit.html"><i class="bi bi-plus-lg" aria-hidden="true"></i><span class="btn-label">Add Promotion Bonus</span></a>
</div>
</div>

<div class="category-table-wrap bonus-title-table-wrap promotion-workspace-wrap">
<div class="manage-list category-table bonus-title-table promotion-workspace-table" id="promoWorkspaceList" role="rowgroup"></div>
<div class="table-footer standard-pagination category-table-footer bonus-title-footer bo-pagination-standard">
<div class="entries-control">Show
                                    <select id="promoWorkspacePageSize" aria-label="Show entries"><option value="-" selected>-</option><option value="10">10</option><option value="20">20</option><option value="50">50</option><option value="100">100</option><option value="All">All</option></select>
                                    entries</div>
<div class="table-info" id="promoWorkspaceShowingText">Showing 0 to 0 of 0
                                    entries</div>
<nav class="pagination-clean bo-pagination-buttons mad-pager" id="promoWorkspacePager" aria-label="Table pagination"></nav>
</div>
</div>
<div class="upload-status" id="promoWorkspaceStatusBox"></div>
</div>

<!-- Category create/edit. crud-modal-pattern.js lifts this card into the shared
     modal; this page opens it (Add / a row's edit button) so the modal can be titled
     for a category rather than inheriting the page's own "Promotion Bonus" label —
     hence data-crud-no-add on <body>, which stops the pattern injecting its own Add
     button. The Chinese fields are not authored here: dynamic-translation.js owns them
     through the declarative data-translation-* attributes below (it strips the legacy
     nameZh/imageZh inputs). -->
<div class="manage-form-card">
<div class="section-title mb-3">
<div>
<h3 id="bonusFormTitle">Create Bonus Title</h3>
</div>
</div>
<form id="bonusForm" class="slider-form" data-translation-ref-type="bonus_category" data-translation-id-selector="#bonusId">
<input type="hidden" id="bonusId" name="id" />
<div class="slider-upload-box" id="bonusDropZone">
<input type="file" id="bonusImage" name="image" accept="image/*" />
<div class="slider-upload-placeholder" id="bonusUploadPlaceholder">
<i class="bi bi-cloud-arrow-up"></i>
<strong>Choose image or drag here</strong>
<small>PNG, JPG, WEBP, GIF accepted</small>
</div>
<img id="bonusPreview" alt="Bonus category preview" hidden />
</div>
<div class="slider-current-image" id="bonusCurrentImage" hidden>
                  Current image will remain if no new image selected.
                </div>
<div class="field mt-3">
<label>Name</label>
<input id="bonusName" name="name" type="text" placeholder="Example: Hot Promotion" />
</div>
<div class="field">
<label>Sort Order</label>
<input id="bonusSortOrder" name="sortOrder" type="number" min="0" value="0" />
</div>
<div class="slider-form-actions">
<button class="clean-btn primary" id="saveBonusBtn" type="submit"><i class="bi bi-save"></i> Save Category</button>
<button class="clean-btn" id="resetBonusBtn" type="button"><i class="bi bi-arrow-counterclockwise"></i> Reset</button>
</div>
<div class="upload-status" id="bonusStatusBox"></div>
</form>
</div>
</div>
</section>
</main>
</div>
