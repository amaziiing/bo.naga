<!-- Modals stay at body level, outside .report-shell: main.report-main is a z-index:1 stacking
     context, so a modal nested inside it can never paint above the sidebar's z-index:1040. -->
<div aria-hidden="true" class="modal-clean pm-modal" id="pmModal">
<div aria-hidden="true" class="modal-clean-panel pm-modal-panel">
<div aria-hidden="true" class="modal-clean-head pm-modal-head">
<div><h3 id="pmFormTitle">Create Payment Method</h3><small>Add a new payment option for customer deposits.</small></div>
<button class="modal-clean-close" data-pm-close="" type="button"><i class="bi bi-x-lg"></i></button>
</div>
<form class="modal-clean-body pm-modal-body" id="pmForm">
<input id="pmId" type="hidden"/>
<section class="pm-form-section"><h4><i class="bi bi-wallet2"></i> 1. Basic Information</h4><div class="pm-form-grid pm-grid-4">
<div class="field"><label>Method Type <b>*</b></label><select id="pmType"><option value="ONLINE_BANKING">Online Banking</option><option value="EWALLET">E-Wallet</option><option value="CARD">Card</option><option value="CASH">Cash</option></select></div>
<div class="field"><label>Status <b>*</b></label><select id="pmStatus"><option value="1">Active</option><option value="0">Inactive</option></select></div>
<div class="field"><label>Display Name <b>*</b></label><input id="pmName" placeholder="e.g. Test Bank"/></div>
<div class="field"><label>Subtitle</label><input id="pmSubtitle" placeholder="e.g. Fast deposit"/></div>
</div></section>
<section class="pm-form-section" id="pmAccountSection"><h4><i class="bi bi-clipboard2"></i> <span id="pmAccountSectionTitle">2. Account Details</span></h4><div class="pm-form-grid pm-grid-4">
<div class="field"><label id="pmBankNameLabel">Bank Name <b>*</b></label><input id="pmBankName" placeholder="e.g. Test Bank"/></div>
<div class="field"><label id="pmAccountNameLabel">Account Name <b>*</b></label><input id="pmAccountName" placeholder="e.g. Main Account"/></div>
<div class="field"><label id="pmAccountNoLabel">Account Number <b>*</b></label><input id="pmAccountNo" placeholder="e.g. 001234567"/></div>
<div class="field"><label>Bank BSB</label><input id="pmBsb" placeholder="e.g. 123-456"/></div>
</div></section>
<section class="pm-form-section"><h4><i class="bi bi-sliders"></i> 3. Limits &amp; Order</h4><div class="pm-form-grid pm-grid-4">
<div class="field"><label>Pay ID</label><input id="pmPayId" placeholder="e.g. PAY123"/></div>
<div class="field"><label>Sort Order <b>*</b></label><input id="pmSort" placeholder="e.g. 0" type="number" value="0"/></div>
<div class="field"><label>Min Amount <b>*</b></label><input id="pmMin" placeholder="e.g. 10.00" step="0.01" type="number" value="10"/></div>
<div class="field"><label>Max Amount <b>*</b></label><input id="pmMax" placeholder="e.g. 0.00" step="0.01" type="number" value="0"/></div>
<div class="field"><label>Visible to VIP Tier</label><input id="pmVipTiers" placeholder="e.g. 0,1,2 or VIP1,VIP2"/></div>
<div class="field"><label>Daily Deposit Threshold</label><input id="pmDailyLimit" min="0" step="0.01" type="number" value="0"/></div>
<div class="field"><label>At Threshold</label><select id="pmAutoRotate"><option value="0">Keep visible</option><option value="1">Auto hide and rotate to next bank</option></select></div>
</div></section>
<section class="pm-form-section"><h4><i class="bi bi-qr-code"></i> 4. QR / E-wallet Image</h4><label class="pm-upload-zone" for="pmQr"><i class="bi bi-cloud-arrow-up"></i><span>Drag and drop an image here, or <b>click to browse</b></span><small>PNG, JPG or WEBP · Max size 2MB · Recommended 512×512px</small><input accept="image/*" id="pmQr" type="file"/></label></section>
<section class="pm-form-section"><h4><i class="bi bi-card-text"></i> 5. Instructions</h4><div class="field"><textarea id="pmInstructions" maxlength="500" placeholder="Payment instructions shown on Naga deposit page..." rows="4"></textarea></div></section>
<div class="pm-modal-actions"><button class="clean-btn" id="pmReset" type="button">Cancel</button><button class="clean-btn primary" id="pmSubmitBtn" type="submit">Create Payment Method</button></div>
</form>
</div>
