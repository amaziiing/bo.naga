<body class="report-body bo-charcoal bo-account-chip banner-edit-page subcategory-edit-page">
<div class="report-shell">
  <aside class="report-sidebar" id="reportSidebar">
    <div class="report-brand">
      <div>Backoffice</div>
      <button class="close-side" data-close-sidebar><i class="bi bi-x-lg"></i></button>
    </div>
    <nav class="report-nav"></nav>
  </aside>
  <div class="sidebar-overlay" id="reportOverlay" data-close-sidebar></div>
  <main class="report-main">
    <header class="report-topbar" data-bo-topbar data-bo-title="Create Sub Category" data-bo-icon="bi-diagram-3" data-bo-h1-id="subCategoryEditPageTitle"></header>
<script src="assets/js/bo-topbar.js?v=1"></script>

    <section class="report-content banner-edit-workspace subcategory-edit-workspace">
      <form id="subCategoryForm" class="slider-form subcategory-edit-form" novalidate>
        <input type="hidden" id="subCategoryId" name="id"/>

        <section class="banner-edit-section">
          <header class="banner-edit-section-head">
            <div class="banner-edit-section-title">
              <span class="banner-edit-section-icon" aria-hidden="true"><i class="bi bi-diagram-3"></i></span>
              <div>
                <h2>Placement</h2>
                <p>Parent shelf and provider this filter tab belongs to.</p>
              </div>
            </div>
            <a class="clean-btn mad-btn-ghost banner-edit-back" href="game-sub-category.html">
              <i class="bi bi-arrow-left" aria-hidden="true"></i> Back to list
            </a>
          </header>

          <div class="subcategory-detail-grid">
            <div class="field">
              <label for="subCategoryCategoryId">Parent Category <b>*</b></label>
              <select id="subCategoryCategoryId" name="categoryId"></select>
            </div>
            <div class="field">
              <label for="subCategoryProviderCode">Provider <b>*</b></label>
              <select id="subCategoryProviderCode" name="providerCode"></select>
            </div>
            <div class="field subcategory-field-span">
              <p class="subcategory-help-copy">
                Each provider can keep its own filter tabs — for example FACHAI: Hot/New, LIVE22: Slot/Fishing.
              </p>
            </div>
          </div>
        </section>

        <section class="banner-edit-section">
          <header class="banner-edit-section-head">
            <div class="banner-edit-section-title">
              <span class="banner-edit-section-icon is-copy" aria-hidden="true"><i class="bi bi-card-heading"></i></span>
              <div>
                <h2>Identity</h2>
                <p>Name the tab, set order, and publish state.</p>
              </div>
            </div>
          </header>

          <div class="subcategory-detail-grid">
            <div class="field">
              <label for="subCategoryName">Sub Category Name <b>*</b></label>
              <input id="subCategoryName" name="name" type="text" placeholder="Example: Mini Game" autocomplete="off"/>
            </div>
            <div class="field">
              <label for="subCategoryNameZh">Chinese Name</label>
              <input id="subCategoryNameZh" name="nameZh" type="text" placeholder="Chinese sub category name" autocomplete="off"/>
            </div>
            <div class="field">
              <label for="subCategorySortOrder">Sort Order</label>
              <input id="subCategorySortOrder" name="sortOrder" type="number" min="0" value="0"/>
            </div>
            <div class="field">
              <span class="banner-field-label">Status</span>
              <div class="banner-status-seg" id="subCategoryStatusSeg" role="group" aria-label="Sub category status">
                <button type="button" class="banner-status-opt is-active" data-status="1">Active</button>
                <button type="button" class="banner-status-opt" data-status="2">Inactive</button>
              </div>
              <input type="hidden" id="subCategoryStatus" name="status" value="1"/>
            </div>
          </div>
        </section>

        <div class="upload-status" id="subCategoryStatusBox"></div>
      </form>
    </section>

    <footer class="banner-edit-footer" id="subCategoryEditFooter">
      <div class="banner-edit-footer-actions">
        <button class="clean-btn mad-btn-ghost" id="resetSubCategoryBtn" type="button" form="subCategoryForm">
          <i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i> Reset
        </button>
        <button class="clean-btn primary" id="saveSubCategoryBtn" type="submit" form="subCategoryForm">
          <i class="bi bi-check-lg" aria-hidden="true"></i> Save Sub Category
        </button>
      </div>
    </footer>
  </main>
</div>
