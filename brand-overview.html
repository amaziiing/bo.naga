<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/reports.css?v=e2945fca" rel="stylesheet">
  <link href="assets/css/bo-ui-standard.css?v=13427ee9" rel="stylesheet">
  <link href="assets/css/brand-overview-executive.css?v=086eb4e9" rel="stylesheet">
<link href="assets/css/bo-account-chip.css?v=e6d15d38" rel="stylesheet" />
<link href="assets/css/bo-charcoal-shell.css?v=30d0b554" rel="stylesheet" />
<link href="assets/css/bo-charcoal-legacy.css?v=38827733" rel="stylesheet" />
<link href="assets/css/bo-charcoal-primitives.css?v=335690e2" rel="stylesheet" />
<link href="assets/css/bo-input-fill.css?v=1969f85a" rel="stylesheet" />
<link href="assets/css/bo-scrollbar.css?v=7c2a456b" rel="stylesheet"/>
<link href="assets/css/bo-field-standard.css?v=06f5ae19" rel="stylesheet">
  <script>
  (function(){
    try{
      if(localStorage.getItem('bo_theme')==='dark') document.documentElement.setAttribute('data-bo-theme','dark');
    }catch(e){}
  })();
  </script>
<link href="assets/css/bo-shell.css?v=1aa0789c" rel="stylesheet" />
</head>
<body class="report-body brand-exec-page bo-charcoal bo-account-chip" data-access-page="brand_overview">
<div class="report-shell">
  <aside class="report-sidebar" id="reportSidebar">
    <div class="report-brand"><div>Backoffice</div><button class="close-side" data-close-sidebar><i class="bi bi-x-lg"></i></button></div>
    <nav class="report-nav"></nav>
  </aside>
  <div class="sidebar-overlay" data-close-sidebar id="reportOverlay"></div>
  <main class="report-main">
    <header class="report-topbar brand-exec-topbar" data-bo-topbar data-bo-title="Brands" data-bo-icon="bi-building"></header>
<script src="assets/js/bo-topbar.js?v=1"></script>

    <section class="report-content brand-exec-content" id="brandExecRoot">
      <div class="brand-exec-filter-card">
        <div class="brand-exec-date-field field">
          <div class="ref-range-wrap">
            <button class="ref-range-trigger" id="brandDateTrigger" type="button">
              <span class="ref-range-icon"><i class="bi bi-calendar3"></i></span>
              <span id="brandDateLabel">Select date range</span>
              <i class="bi bi-chevron-down ms-auto"></i>
            </button>
            <input id="brandOverviewFrom" type="hidden">
            <input id="brandOverviewTo" type="hidden">
            <div class="ref-range-picker" id="brandRangePicker">
              <div class="ref-range-presets">
                <button data-brand-range-preset="today" type="button">Today</button>
                <button data-brand-range-preset="yesterday" type="button">Yesterday</button>
                <button data-brand-range-preset="thisWeek" type="button">This Week</button>
                <button data-brand-range-preset="lastWeek" type="button">Last Week</button>
                <button data-brand-range-preset="thisMonth" type="button">This Month</button>
                <button data-brand-range-preset="lastMonth" type="button">Last Month</button>
                <button data-brand-range-preset="thisYear" type="button">This Year</button>
                <button data-brand-range-preset="lastYear" type="button">Last Year</button>
              </div>
              <div class="ref-range-calendar">
                <div class="ref-cal-head">
                  <button id="brandCalPrev" type="button"><i class="bi bi-chevron-left"></i></button>
                  <button class="ref-head-pick" id="brandCalMonth" type="button"></button>
                  <button class="ref-head-pick" id="brandCalYear" type="button"></button>
                  <button id="brandCalNext" type="button"><i class="bi bi-chevron-right"></i></button>
                </div>
                <div class="ref-cal-month-grid" id="brandCalMonthGrid"></div>
                <div class="ref-cal-year-grid" id="brandCalYearGrid"></div>
                <div class="ref-cal-day-view" id="brandCalDayView">
                  <div class="ref-cal-week"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
                  <div class="ref-cal-days" id="brandCalDays"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <button class="brand-exec-search" id="brandOverviewRefresh" type="button"><i class="bi bi-search"></i><span>Search</span></button>
        <button class="brand-exec-export" id="brandOverviewExport" type="button"><i class="bi bi-upload"></i><span>Export</span></button>
      </div>

      <div class="brand-exec-card">
        <div class="brand-exec-section-head">
          <h2>All Brands Overview</h2>
          <p>Summary of key financial metrics for all brands.</p>
        </div>
        <div class="brand-exec-table-wrap">
          <table class="brand-exec-table">
            <thead><tr>
              <th>Brand</th>
              <th id="brandNetGamingHead">Net Gaming (MYR)</th>
              <th id="brandProviderCostHead">Provider Cost (MYR)</th>
              <th id="brandNetProfitHead">Net Profit (MYR)</th>
              <th id="brandTurnoverHead">Turnover (MYR)</th>
              <th>Bets</th>
              <th>Status</th>
              <th>Action</th>
            </tr></thead>
            <tbody id="brandOverviewRows"><tr><td colspan="8" class="brand-exec-empty">Loading...</td></tr></tbody>
          </table>
        </div>
        <div class="brand-exec-footer">
          <div id="brandOverviewShowing">Showing 0 to 0 of 0 brands</div>
          <div class="brand-exec-pagination">
            <button id="brandOverviewPrev" type="button" aria-label="Previous page"><i class="bi bi-chevron-left"></i></button>
            <span id="brandOverviewPage">1</span>
            <button id="brandOverviewNext" type="button" aria-label="Next page"><i class="bi bi-chevron-right"></i></button>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

</html>
