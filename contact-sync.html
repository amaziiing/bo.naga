<style>/* First-paint canvas. The real background (gradient, theme colours) comes from the external sheets, but until they arrive the browser paints its default white - visible as a white flash on every tab switch. This gives the canvas its colour before any request lands, and the sheets override it later (same specificity, later in the cascade). */html{background:#FFF8EB}html[data-bo-theme="dark"]{background:#2C2E38}</style>
<script>!function(){try{var t=localStorage.getItem('bo_theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-bo-theme',t);}catch(e){}}();window.boShellBoot=function(){try{var h=localStorage.getItem('bo_shell_nav_v1');if(!h)return;var u={};try{u=JSON.parse(localStorage.getItem('bo_admin_user')||'{}')||{};}catch(e){}var stamp=String(u.id||u.username||u.email||'');if(stamp&&localStorage.getItem('bo_shell_nav_user_v1')!==stamp)return;var nav=document.querySelector('.report-nav');if(nav)nav.innerHTML=h;}catch(e){}};</script>

<body class="report-body bo-charcoal bo-account-chip" data-access-page="contact_sync">
<div class="report-shell">
  <aside class="report-sidebar" id="reportSidebar"><div class="report-brand"><div>Backoffice</div><button class="close-side" data-close-sidebar><i class="bi bi-x-lg"></i></button></div><nav class="report-nav"></nav><script>window.boShellBoot&&window.boShellBoot()</script></aside>
  <div class="sidebar-overlay" data-close-sidebar></div>
  <main class="report-main">
    <header class="report-topbar"><button class="hamb" data-open-sidebar><i class="bi bi-list"></i></button><div></div><div class="report-actions"><button type="button" class="bo-theme-btn" id="boThemeToggle"><i class="bi bi-sun-fill" data-theme-icon="sun"></i><i class="bi bi-moon-fill" data-theme-icon="moon" hidden></i></button><div data-bo-profile></div></div></header>

      </div>
      <div class="card border-0 shadow-sm"><div class="card-body">
        <div class="row g-3 mb-3">
          <div class="col-md-4"><label class="form-label">Search</label><input class="form-control" id="contactSearch" placeholder="Name, phone, device or brand"></div>

    </section>
