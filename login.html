<!doctype html>
<html lang="en">
<head>
<style>/* First-paint canvas. The real background (gradient, theme colours) comes from the external sheets, but until they arrive the browser paints its default white - visible as a white flash on every tab switch. This gives the canvas its colour before any request lands, and the sheets override it later (same specificity, later in the cascade). */html{background:#FFF8EB}html[data-bo-theme="dark"]{background:#2C2E38}</style>
<script>!function(){try{var t=localStorage.getItem('bo_theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-bo-theme',t);}catch(e){}}();window.boShellBoot_disabled=function(){try{var pg=(location.pathname.split('/').pop()||'').toLowerCase();var h=localStorage.getItem('bo_shell_nav_v1_'+pg)||localStorage.getItem('bo_shell_nav_v1');if(!h)return;var u={};try{u=JSON.parse(localStorage.getItem('bo_admin_user')||'{}')||{};}catch(e){}var stamp=String(u.id||u.username||u.email||'');if(stamp&&localStorage.getItem('bo_shell_nav_user_v1')!==stamp)return;var nav=document.querySelector('.report-nav');if(nav)nav.innerHTML=h;}catch(e){}};</script>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#FFF1DC" />
  <title>Backoffice Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <link href="assets/css/login.css?v=477484bb" rel="stylesheet" />  <link href="assets/css/bo-targeted-fixes.css?v=7a2ebdcc" rel="stylesheet" />
<link href="assets/css/bo-account-chip.css?v=e6d15d38" rel="stylesheet" />
<link href="assets/css/bo-charcoal-shell.css?v=411127d0" rel="stylesheet" />
<link href="assets/css/bo-charcoal-legacy.css?v=461c8bb1" rel="stylesheet" />
<link href="assets/css/bo-charcoal-primitives.css?v=335690e2" rel="stylesheet" />
<link href="assets/css/bo-charcoal-cms.css?v=c313fb33" rel="stylesheet" />
<link href="assets/css/bo-input-fill.css?v=1969f85a" rel="stylesheet" />
<link href="assets/css/bo-scrollbar.css?v=7c2a456b" rel="stylesheet"/>
<link href="assets/css/bo-field-standard.css?v=06f5ae19" rel="stylesheet">
</head>
<body class="report-body bo-login-body bo-charcoal bo-account-chip">
  <main class="auth-page">
    <section class="auth-card" aria-labelledby="loginTitle">
      <div class="auth-theme-slot">
        <button type="button" class="bo-theme-btn" id="boThemeToggle" aria-pressed="false" title="Switch to dark mode" aria-label="Switch to dark mode">
          <i class="bi bi-sun-fill" data-theme-icon="sun"></i>
          <i class="bi bi-moon-fill" data-theme-icon="moon" hidden></i>
        </button>
      </div>

      <header class="auth-heading">
        <h1 id="loginTitle">Sign in</h1>
      </header>

      <form id="adminLoginForm">
        <div class="auth-field">
          <label for="adminUsername">Username</label>
          <div class="auth-input-wrap">
            <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 21a8 8 0 0 0-16 0"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input class="form-control" id="adminUsername" type="text" placeholder="Enter your username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
          </div>
        </div>

        <div class="auth-field">
          <label for="adminPassword">Password</label>
          <div class="auth-input-wrap">
            <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4" y="10" width="16" height="11" rx="3"/>
              <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
            </svg>
            <input class="form-control" id="adminPassword" type="password" placeholder="Enter your password" autocomplete="current-password" required>
            <button class="password-toggle" id="passwordToggle" type="button" aria-label="Show password" aria-pressed="false">
              <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/>
                <circle cx="12" cy="12" r="2.7"/>
              </svg>
              <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
                <path d="m3 3 18 18"/>
                <path d="M10.6 6.2A9.9 9.9 0 0 1 12 6c6 0 9.5 6 9.5 6a16 16 0 0 1-2.1 2.9"/>
                <path d="M6.2 6.2C3.8 7.9 2.5 12 2.5 12s3.5 6 9.5 6c1.7 0 3.2-.5 4.5-1.2"/>
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="upload-status" id="adminLoginStatus" role="status" aria-live="polite"></div>

        <button class="btn auth-submit w-100" id="adminLoginBtn" type="submit">
          <span>Sign in to Backoffice</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14"/>
            <path d="m13 6 6 6-6 6"/>
          </svg>
        </button>
      </form>
    </section>
  </main>

  <script>
    (function(){
      const toggle = document.getElementById('passwordToggle');
      const input = document.getElementById('adminPassword');
      if(!toggle || !input) return;
      toggle.addEventListener('click', function(){
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        toggle.setAttribute('aria-pressed', String(show));
        toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        const openEye = toggle.querySelector('.eye-open');
        const closedEye = toggle.querySelector('.eye-closed');
        if(openEye) openEye.hidden = show;
        if(closedEye) closedEye.hidden = !show;
        input.focus({preventScroll:true});
      });
    })();
  </script>

</html>
